    + '<div class="fp-row"><span class="fp-label">动作</span><div class="fp-chips">';
  actionOpts.forEach(function (o) {
    html += '<button class="chip ' + (state.auditActionFilter === o[0] ? 'active' : '') + '" data-action="audit-filter" data-key="auditActionFilter" data-val="' + o[0] + '">' + o[1] + '</button>';
  });
  html += '</div></div></div>';

  /* 应用筛选 */
  let list = AUDIT_LIST.slice();
  if (state.auditDateRange !== 'all') {
    const days = { '1d': 1, '7d': 7, '30d': 30 }[state.auditDateRange] || 7;
    const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - days);
    list = list.filter(function (a) { return new Date(a.created_at) >= cutoff; });
  }
  if (state.auditTenantFilter !== 'all') list = list.filter(function (a) { return a.tenant_id === state.auditTenantFilter; });
  if (state.auditActionFilter !== 'all') list = list.filter(function (a) { return a.action === state.auditActionFilter; });

  if (!list.length) {
    html += '<div class="card-body"><div class="mini text-muted">该筛选条件下暂无记录。</div></div></div>';
    return html;
  }
  html += '<div class="card-body" style="padding:0;overflow:auto"><table class="tbl"><thead><tr>'
    + '<th>时间</th><th>租户</th><th>客户</th><th>动作</th><th>详情</th>'
    + '</tr></thead><tbody>';
  list.forEach(function (a) {
    const c = a.customer_id ? cust(a.customer_id) : null;
    const raw = a.detail ? (typeof a.detail === 'string' ? a.detail : JSON.stringify(a.detail)) : '';
    const detail = raw ? esc(raw.slice(0, 120)) + (raw.length > 120 ? '…' : '') : '—';
    html += '<tr>'
      + '<td class="mini" style="white-space:nowrap">' + (a.created_at ? String(a.created_at).replace('T', ' ').slice(0, 19) : '—') + '</td>'
      + '<td>' + esc(auditTenantName(a.tenant_id)) + '</td>'
      + '<td class="mini">' + esc(c ? c.name : (a.customer_id || '—')) + '</td>'
      + '<td><span class="pill" style="background:#eef2f1;color:#1a5c4b">' + esc(AUDIT_ACTIONS[a.action] || a.action || '—') + '</span></td>'
      + '<td class="mini" style="max-width:320px;word-break:break-all">' + detail + '</td>'
      + '</tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}

/* ---------- 19. 渲染主循环 ---------- */
function renderNav() {
  const hideGroups = !isAdmin() ? ['资源库', '系统管理'] : [];
  const hideItems = !isAdmin() ? ['nearing', 'archived', 'warranty', 'sleeping', 'lost', 'escaped'] : [];
  let html = '';
  NAV_GROUPS.forEach(function (g) {
    if (hideGroups.indexOf(g.name) >= 0) return;
    const items = g.items.filter(function (k) {
      if (hideItems.indexOf(k) >= 0) return false;
      return (k !== 'tenants' && k !== 'audit') || isAdmin();
    });
    if (!items.length) return;
    html += '<div class="nav-group"><div class="nav-group-t">' + g.name + '</div>';
    items.forEach(function (k) {
      const v = VIEWS[k];
      if (!v) return;
      const n = typeof v.count === 'function' ? v.count() : 0;
      html += '<button class="nav-item ' + (state.view === k ? 'active' : '') + '" data-action="nav" data-view="' + k + '">'
        + '<span class="ico">' + (NAV_ICONS[k] || '·') + '</span><span class="flex-1 truncate">' + v.title + '</span>'
        + (n ? '<span class="cnt">' + n + '</span>' : '') + '</button>';
    });
    html += '</div>';
  });
  $('#nav').innerHTML = html;
}
function render(noScroll) {
  const v = VIEWS[state.view] || VIEWS.today;
  $('#topTitle').textContent = v.title;
  let body = v.render();
  if (isOtherTenant()) {
    const t = (TENANT_LIST || []).filter(function (x) { return x.id === ACTIVE_TENANT; })[0];
    body = '<div style="background:#d64545;color:#fff;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px">'
      + '⚠ 正在以管理员身份编辑租户「' + esc(t ? t.name : ACTIVE_TENANT) + '」的数据，所有改动会直接写入该租户。'
      + ' <button class="btn btn-sm" style="margin-left:8px;background:#fff;color:#d64545;border:none" data-action="exit-tenant">退出该租户</button>'
      + '</div>' + body;
  }
  /* 筛选面板：只在客户视图 / 今日视图 显示 */
  const filterViews = ['customers', 'today', 'key', 'deposit', 'design', 'build', 'constructing', 'nearing', 'warranty', 'sleeping', 'lost', 'escaped'];
  const hasFilter = filterViews.indexOf(state.view) >= 0;
  const anyFilter = hasFilter && (state.stageFilter !== 'all' || state.intentFilter !== 'all' || state.statusFilter !== 'all' || state.overdueFilter !== 'all');
  const badge = document.getElementById('filterBadge');
  if (badge) badge.style.display = anyFilter ? 'inline-block' : 'none';
  if (state.showFilter && hasFilter) {
    body = renderFilterPanel() + body;
  }
  $('#view').innerHTML = body;
  renderNav();
  $$('#tabbar button').forEach(function (btn) {
    btn.classList.toggle('active', btn.getAttribute('data-view') === state.view);
  });
  const d = $('#drawer');
  /* 记录展开中的折叠面板，重渲染后恢复，避免上传/保存后被收起 */
  const openIdx = [];
  if (state.drawerId && d.querySelectorAll('details').length) {
    Array.prototype.forEach.call(d.querySelectorAll('details'), function (el, i) {
      if (el.open) openIdx.push(i);
    });
  }
  if (state.drawerId) {
    d.innerHTML = renderDrawer(state.drawerId);
    d.classList.add('open');
    if (openIdx.length) {
      Array.prototype.forEach.call(d.querySelectorAll('details'), function (el, i) {
        if (openIdx.indexOf(i) >= 0) el.open = true;
      });
    }
  } else { d.innerHTML = ''; d.classList.remove('open'); }
  hydrateAttUrls();
  if (!noScroll) window.scrollTo(0, 0);
}
function toast(msg, dur) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function () { t.classList.remove('show'); }, dur || 1900);
}
function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  } catch (e) { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

/* ---------- 20. 事件 ---------- */
/* 模态框焦点隔离：open 时背景区域 inert，关闭时恢复；自动聚焦首个输入框 */
(function () {
  const modal = document.getElementById('modal');
  if (!modal) return;
  const bg = ['.app', '#tabbar', '#drawer', '#uploadbar'];
  new MutationObserver(function () {
    const open = modal.classList.contains('open');
    bg.forEach(function (sel) {
      const el = document.querySelector(sel);
      if (el) { if (open) el.setAttribute('inert', ''); else el.removeAttribute('inert'); }
    });
    if (open) {
      const f = modal.querySelector('input, select, textarea');
      if (f) setTimeout(function () { f.focus(); }, 60);
    }
  }).observe(modal, { attributes: true, attributeFilter: ['class'] });
})();

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  const m = $('#modal');
  if (m && m.classList.contains('open')) { m.classList.remove('open'); return; }
  if (state.drawerId) { state.drawerId = null; render(); }
});

document.addEventListener('click', function (e) {
  if (e.target.id === 'modal') { $('#modal').classList.remove('open'); return; }
  if (e.target.id === 'drawer') { state.drawerId = null; render(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');

  /* 数据同步期间锁定操作，避免在空数据视图上误触 */
  if (SYNC_LOCK) { toast('数据同步中，请稍候…'); return; }

  if (act === 'toggle-nav') { document.body.classList.toggle('nav-open'); return; }
  if (act === 'nav') {
    state.view = el.getAttribute('data-view');
    state.drawerId = null;
    document.body.classList.remove('nav-open');
    render();
    return;
  }
  if (act === 'open-customer') {
    state.drawerId = id;
    render();
    loadAttachments(id, function () { if (state.drawerId === id) render(); });
    return;
  }
  if (act === 'refresh-tenants') { TENANT_LIST = null; refreshTenants(); render(); return; }
  if (act === 'refresh-audit') { AUDIT_LIST = null; refreshAudit(); render(); return; }
  if (act === 'switch-tenant') { switchTenant(id); return; }
  if (act === 'exit-tenant') { exitTenant(); return; }
  if (act === 'tenant-status') {
    setTenantStatus(id, (el && el.getAttribute('data-status')) || 'disabled');
    return;
  }
  if (act === 'admin-reset-pwd') {
    if (!isAdmin() || !HC_SB) return;
    const tname = (el && el.getAttribute('data-name')) || '该租户';
    const pwd = prompt('为「' + tname + '」设置新密码（至少 6 位）：');
    if (pwd === null) return;
    if (pwd.length < 6) { toast('密码至少 6 位'); return; }
    if (!confirm('确认将「' + tname + '」的密码重置为：' + pwd + ' ？\n请线下告知对方，并提醒登录后自行修改。')) return;
    el.disabled = true;
    HC_SB.rpc('hc_admin_reset_password', { p_user_id: id, p_password: pwd }).then(function (r) {
      el.disabled = false;
      if (r.error) {
        if (/hc_admin_reset_password|function.*does not exist/i.test(r.error.message || '')) {
          toast('数据库函数未创建：请先在 Supabase 执行 migration_v3.sql');
        } else {
          toast('重置失败：' + r.error.message);
        }
        return;
      }
      const res = r.data || {};
      if (!res.ok) {
        toast(res.error === 'forbidden' ? '仅超级管理员可执行' : (res.error === 'weak_password' ? '密码至少 6 位' : '未找到该用户'));
        return;
      }
      auditWrite(null, 'admin_reset_password', '重置租户「' + tname + '」(' + id.slice(0, 8) + '…)的登录密码');
      toast('已重置「' + tname + '」的密码');
    });
    return;
  }
  if (act === 'close-drawer') { state.drawerId = null; render(); return; }
  if (act === 'new-customer') { $('#modal').innerHTML = renderModal(); $('#modal').classList.add('open'); return; }
  if (act === 'close-modal') { $('#modal').classList.remove('open'); return; }
  if (act === 'reset') {
    /* 云端模式仅超管可清空数据，普通租户隐藏并拦截 */
    if (CLOUD_ON && !isAdmin()) { toast('仅超级管理员可执行此操作'); return; }
    const tip = CLOUD_ON
      ? '确定清空当前租户的全部数据？此操作不可恢复。'
      : '重置为演示数据？本地保存的修改将丢失。';
    if (confirm(tip)) { resetDB(); render(); toast(CLOUD_ON ? '已清空' : '已重置'); }
    return;
  }
  if (act === 'save-customer') { saveCustomer(); return; }
  if (act === 'toggle-quick-follow') {
    const qf = $('#qf_' + id);
    if (!qf) return;
    if (qf.style.display === 'none' || !qf.innerHTML) {
      qf.innerHTML = renderQuickFollow(id);
      qf.style.display = 'block';
    } else {
      qf.style.display = 'none';
    }
    return;
  }
  if (act === 'quick-follow-row') {
    /* 在抽屉底部动态插入快速跟进表单 */
    const existing = $('#qf_drawer_' + id);
    if (existing && existing.style.display !== 'none') {
      existing.style.display = 'none';
      return;
    }
    const box = document.createElement('div');
    box.id = 'qf_drawer_' + id;
    box.innerHTML = renderQuickFollow(id);
    box.style.display = 'block';
    const drawerBody = $('#drawer .drawer-body');
    if (drawerBody) drawerBody.insertBefore(box, drawerBody.firstChild);
    return;
  }
  if (act === 'save-quick-follow') {
    const cid = id;
    const typeEl = document.querySelector('[data-qf-type="' + cid + '"]');
    const contentEl = document.querySelector('[data-qf-content="' + cid + '"]');
    const nextEl = document.querySelector('[data-qf-next="' + cid + '"]');
    saveQuickFollow(cid, typeEl?.value || '', contentEl?.value || '', nextEl?.value || '');
    const qf = $('#qf_' + cid);
    if (qf) qf.style.display = 'none';
    /* 更新该行显示 */
    render();
    return;
  }
  if (act === 'task-filter') { state.taskFilter = el.getAttribute('data-val'); render(); return; }
  if (act === 'constructing-filter') { state.constructingStage = el.getAttribute('data-val'); render(); return; }
  if (act === 'toggle-filter') { state.showFilter = !state.showFilter; render(); return; }
  if (act === 'filter-change') { state[el.getAttribute('data-key')] = el.getAttribute('data-val'); render(); return; }
  if (act === 'filter-clear') { clearCustomerFilters(); render(); return; }
  if (act === 'audit-filter') { state[el.getAttribute('data-key')] = el.getAttribute('data-val'); render(); return; }
  if (act === 'ai-tab') { state.aiTab = el.getAttribute('data-val'); render(); return; }
  if (act === 'cal-day') { state.calDay = el.getAttribute('data-val'); render(); return; }
  if (act === 'cal-today') { state.calMonth = TODAY.slice(0, 7); state.calDay = TODAY; render(); return; }
  if (act === 'cal-copy') {
    copyText(buildDayReport(state.calDay));
    return;
  }
  if (act === 'cal-export-day') {
    dlFile('客户跟进日报_' + state.calDay + '.txt', buildDayReport(state.calDay));
    toast('已导出当日小结');
    return;
  }
  if (act === 'cal-export-week') {
    dlFile('周度工作计划_' + state.calDay + '.txt', buildWeekReport(state.calDay));
    toast('已导出未来 7 天计划');
    return;
  }
  if (act === 'ai-preset') {
    const pid = el.getAttribute('data-val');
    const pre = AI_PRESETS.filter(function (x) { return x.id === pid; })[0];
    if (!pre) return;
    if ($('#aiBase')) $('#aiBase').value = pre.base;
    if ($('#aiModel')) $('#aiModel').value = pre.model;
    toast('已切换为 ' + pre.name + '，请填写对应的 API Key 后点「测试连接」');
    return;
  }
  if (act === 'ai-cfg-save') {
    const k = ($('#aiKey') || {}).value || '';
    const m = ($('#aiModel') || {}).value || '';
    const bs = ($('#aiBase') || {}).value || '';
    aiCfgSave({ key: k.trim(), model: m.trim() || AI_DEFAULT.model, base: bs.trim() || AI_DEFAULT.base });
    toast(k.trim() ? '已保存，语音精简将使用豆包 AI' : '已清空 Key，回退本地规则精简');
    render();
    return;
  }
  if (act === 'ai-cfg-test') {
    const k = ($('#aiKey') || {}).value || '';
    const m = ($('#aiModel') || {}).value || '';
    const bs = ($('#aiBase') || {}).value || '';
    if (!k.trim()) { toast('请先填写 API Key'); return; }
    aiCfgSave({ key: k.trim(), model: m.trim() || AI_DEFAULT.model, base: bs.trim() || AI_DEFAULT.base });
    toast('正在测试豆包连接…');
    doubaoPolish('嗯，今天给马先生打了电话，就是说确认一下主材进场时间，然后他说下周一进场。')
      .then(function (t) { toast('连接成功：' + String(t).slice(0, 40)); })
      .catch(function (e) { toast('连接失败：' + e.message); });
    return;
  }
  if (act === 'cal-prev' || act === 'cal-next') {
    const cp = String(state.calMonth).split('-');
    let cy = Number(cp[0]), cm = Number(cp[1]) + (act === 'cal-next' ? 1 : -1);
    if (cm < 1) { cm = 12; cy--; }
    if (cm > 12) { cm = 1; cy++; }
    state.calMonth = cy + '-' + pad2(cm);
    render();
    return;
  }
  if (act === 'ai-distill') { doDistill(); return; }
  if (act === 'ai-backfill') { doBackfill(); return; }
  if (act === 'ai-generate') { doGenerate(); return; }
  if (act === 'voice-entry') { $('#modal').innerHTML = renderVoiceModal(); $('#modal').classList.add('open'); return; }
  if (act === 'export-json') { exportJSON(); return; }
  if (act === 'logout') {
    try { localStorage.removeItem('hc_session'); } catch (e) {}
    if (HC_SB) { HC_SB.auth.signOut(); }
    toast('已退出，正在返回登录页…');
    setTimeout(function () { location.href = 'login.html'; }, 500);
    return;
  }
  if (act === 'voice-start') { startVoice(); return; }
  if (act === 'voice-stop') { stopVoice(); return; }
  if (act === 'voice-save') { saveVoiceEntry(); return; }
  if (act === 'voice-parse') { parseVoiceText(); return; }
  if (act === 'voice-polish') {
    const box = $('#voiceText');
    const src = (box ? box.value : voiceState.text) || '';
    if (!src.trim()) { toast('没有可精简的文字'); return; }
    if (aiCfg().key) {
      toast('AI 整理中…');
      aiPolishSmart(src).then(function (r) {
        voiceState.text = r.text;
        if (box) box.value = r.text;
        voiceState.parsed = voiceState.parsed || {};
        voiceState.parsed.content = r.text;
        const cc = $('#v_content');
        if (cc) cc.value = r.text;
        toast(r.note + '：' + src.length + ' → ' + r.text.length + ' 字');
      });
      return;
    }
    const cleaned = aiPolishText(src);
    if (!cleaned) { toast('没有可精简的文字'); return; }
    voiceState.text = cleaned;
    if (box) box.value = cleaned;
    voiceState.parsed = voiceState.parsed || {};
    voiceState.parsed.content = cleaned;
    const cc2 = $('#v_content');
    if (cc2) cc2.value = cleaned;
    toast('AI 已精简：' + src.length + ' → ' + cleaned.length + ' 字');

  if (act === 'goto-ai') { state.view = 'ai'; state.aiTab = 'gen'; render(); return; }
  if (act === 'goto-ai-cal') { state.view = 'ai'; state.aiTab = 'calendar'; render(); return; }

    const s = SCRIPTS.filter(function (x) { return x.id === id; })[0];

  if (act === 'copy-path') {

  if (act === 'copy-feishu') {
    const c = cust(id);
    if (c) copyText(c.feishuLink || ('feishu://bitable/' + c.id));
    return;
  }
  if (act === 'copy-draft') {
    const box = $('#draftText');
    if (box) copyText(box.textContent);
    return;
  }
  if (act === 'open-obsidian') {
    const c = cust(id);
    if (!c) return;
    const p = c.obsidianPath || ('恒彩客户库/' + c.name + '-' + c.community + '-' + c.area + '㎡');
    try { window.location.href = 'obsidian://open?path=' + encodeURIComponent(p); }
    catch (err) { toast('仅桌面端 Obsidian 支持'); }
    toast('若未跳转，请先安装 Obsidian 桌面端');
    return;
  }
  if (act === 'mark-escaped') {
    if (!confirm('确认将该客户标记为逃单？\n标记后将从各阶段列表移除，并跳转到「逃单客户」页面。')) return;
    const c = cust(id);
    if (!c) return;
    c.escaped = true; c.escaped_at = TODAY;
    saveDB();
    state.drawerId = null;
    state.view = 'escaped';
    document.body.classList.remove('nav-open');
    render();
    toast(c.name + ' 已标记逃单，已移到「逃单客户」页面');
    return;
  }
  if (act === 'classify') {
    const bucket = el.getAttribute('data-bucket');
    if (!CLASSIFY_LABELS[bucket]) return;
    const c = cust(id);
    if (!c) return;
    c.classified = bucket;
    c.classified_at = TODAY;
    saveDB();
    state.drawerId = null;
    state.view = bucket;
    document.body.classList.remove('nav-open');
    render();
    toast(c.name + ' 已归入「' + CLASSIFY_LABELS[bucket] + '」');
    return;
  }
  if (act === 'classify-clear') {
    const c = cust(id);
    if (!c) return;
    c.classified = null;
    c.classified_at = null;
    saveDB();
    toast(c.name + ' 已取消分类，恢复自动规则');
    render();
    return;
  }
  if (act === 'restore-customer') {
    const c = cust(id);
    if (c) { c.escaped = false; c.escaped_at = null; saveDB(); toast(c.name + ' 已恢复到原阶段'); render(); }
    return;
  }
  if (act === 'delete-customer') {
    const c = cust(id);
    if (!c) return;
    if (!confirm('确定永久删除客户「' + c.name + '」？\n将同时删除其跟进记录、方案版本、交底、变更、主材等全部关联数据，不可恢复。')) return;
    if (!confirm('再次确认：永久删除「' + c.name + '」及其全部关联数据？')) return;
    DB.customers = DB.customers.filter(function (x) { return x.id !== id; });
    ['followUps', 'versions', 'briefings', 'changes', 'materials'].forEach(function (k) {
      if (DB[k]) DB[k] = DB[k].filter(function (x) { return x.customerId !== id; });
    });
    delete ATT_CACHE[id]; delete ATT_URL[id];
    state.drawerId = null;
    saveDB();
    auditWrite(id, 'customer_delete', { name: c.name });
    render();
    toast('已删除客户「' + c.name + '」');
    return;
  }
  if (act === 'record-follow') {
    const c = cust(id);
    if (!c) return;
    $('#modal').innerHTML = renderFollowModal(id);
    $('#modal').classList.add('open');
    return;
  }
  if (act === 'edit-customer') {
    const c = cust(id);

function fmtSize(n) {
  if (!n) return '0 KB';
  if (n < 1024 * 1024) return Math.max(1, Math.round(n / 1024)) + ' KB';

function isImageName(name, mime) {
  if (mime && mime.indexOf('image/') === 0) return true;

function isVideoName(name, mime) {

/* 图片压缩为 Blob（>500KB 才压，最长边 1600px） */
function compressToBlob(file, cb) {
  if (file.type.indexOf('image/') !== 0 || file.size <= 500 * 1024) { cb(file); return; }
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = function () {
    const maxW = 1600;
    let w = img.width, h = img.height;
    if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    try {
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(function (blob) {
        URL.revokeObjectURL(url);
        cb(blob || file);
      }, 'image/jpeg', 0.82);
    } catch (e) {
      URL.revokeObjectURL(url);
      cb(file);
    }
  };
  img.onerror = function () { URL.revokeObjectURL(url); cb(file); };
  img.src = url;
}

function uploadAttachments(cid, stage, cat, input) {
  const files = Array.prototype.slice.call(input.files || []);
  input.value = '';
  if (!files.length) return;
  if (!HC_SB) { toast('未连接云端，无法上传'); return; }
  if (files.length > MAX_FILES_PER_PICK) { toast('单次最多 ' + MAX_FILES_PER_PICK + ' 个文件，请分批上传'); return; }
  const tenantId = ACTIVE_TENANT || (ME && ME.tenant_id);
  const limit = MAX_FILE_MB * 1024 * 1024;
  let done = 0, ok = 0, fail = 0, lastErr = '';
  showUploadBar('准备上传 ' + files.length + ' 个文件…', 0);
  const finish = function () {
    done++;
    const pct = Math.round(done / files.length * 100);
    if (done < files.length) {
      showUploadBar('上传中 ' + done + '/' + files.length, pct);
      return;
    }
    showUploadBar('上传完成：成功 ' + ok + '，失败 ' + fail, 100);
    delete ATT_CACHE[cid];
    loadAttachments(cid, function () {
      render();
      toast(fail > 0 && lastErr
        ? '上传完成：成功 ' + ok + '，失败 ' + fail + '（' + lastErr + '）'
        : '上传完成：成功 ' + ok + '，失败 ' + fail, fail > 0 ? 4500 : 1900);
      hideUploadBar(1600);
      if (ok > 0) auditWrite(cid, 'attachment_upload', { stage: stage, category: cat, count: ok });
    });
  };
  files.forEach(function (file) {
    if (file.size > limit) {
      fail++;
      lastErr = '单文件上限 ' + MAX_FILE_MB + 'MB';
      toast(file.name + ' 超过 ' + MAX_FILE_MB + 'MB，已跳过');
      finish();
      return;
    }
    compressToBlob(file, function (blob) {
      const safe = (file.name || 'file').replace(/[^\w.\-\u4e00-\u9fa5]/g, '_');
      const path = tenantId + '/' + cid + '/' + stage + '/' + cat + '/' + Date.now() + '_' + safe;
      const mime = blob.type || file.type || 'application/octet-stream';
      HC_SB.storage.from(BUCKET).upload(path, blob, { contentType: mime, upsert: false })
        .then(function (r) {
          if (r && r.error) {
            fail++;
            const msg = String(r.error.message || '');
            const tooLarge = /maximum allowed size|Payload too large|EntityTooLarge|exceeded/i.test(msg);
            lastErr = tooLarge ? '超过云端单文件上限 ' + MAX_FILE_MB + 'MB，请压缩后再传' : msg.slice(0, 30);
            console.warn('[上传失败]', msg);
            toast(file.name + '：' + lastErr, 4200);
            finish();
            return;
          }
          HC_SB.from('attachments').insert({
            tenant_id: tenantId,
            customer_id: cid,
            stage: stage,
            category: cat,
            path: path,
            file_name: file.name,
            size: blob.size || file.size,
            mime: mime
          }).then(function (r2) {
            if (r2 && r2.error) { fail++; console.warn('[入库失败]', r2.error.message); }
            else { ok++; }
            finish();
          });
        })
        .catch(function (e) { fail++; console.warn('[上传异常]', e); finish(); });
    });
  });
}

/* ---------- 灯箱（图片放大 + 视频播放） ---------- */
const LB = {
  list: [],       // 当前浏览序列（同客户同类别）
  idx: 0,         // 当前索引
  mode: 'image',  // 'image' | 'video'
  zoomed: false
};
function lbAttOf(attId) {
  /* 取当前附件所在的浏览序列：同客户 + 同阶段 + 同类别 + 同媒体类型 */
  const cid = state.drawerId;
  const cur = (ATT_CACHE[cid] || []).filter(function (a) { return a.id === attId; })[0];
  if (!cur) return { list: [], idx: 0, cur: null };
  const isVideo = isVideoName(cur.file_name, cur.mime);
  const sameKind = function (a) {
    return a.stage === cur.stage && a.category === cur.category
      && (isVideo ? isVideoName(a.file_name, a.mime) : isImageName(a.file_name, a.mime));
  };
  const list = (ATT_CACHE[cid] || []).filter(sameKind);
  const idx = list.findIndex(function (a) { return a.id === attId; });
  return { list: list, idx: Math.max(0, idx), cur: cur };
}
function openLightbox(attId) {
  const r = lbAttOf(attId);
  if (!r.cur) return;
  LB.list = r.list; LB.idx = r.idx; LB.mode = 'image'; LB.zoomed = false;
  renderLightbox();
  $('#lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function openVideoPlayer(attId) {
  const r = lbAttOf(attId);
  if (!r.cur) return;
  LB.list = r.list; LB.idx = r.idx; LB.mode = 'video'; LB.zoomed = false;
  renderLightbox();
  $('#lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  const lb = $('#lightbox');
  lb.classList.remove('open');
  $('#lbStage').innerHTML = '';  // 停止视频播放 + 释放图片
  LB.list = []; LB.idx = 0; LB.zoomed = false;
  document.body.style.overflow = '';
}
function lbNav(step) {
  if (!LB.list.length) return;
  const next = LB.idx + step;
  if (next < 0 || next >= LB.list.length) return;
  LB.idx = next;
  LB.zoomed = false;
  renderLightbox();
}
function lbToggleZoom() {
  if (LB.mode !== 'image') return;
  LB.zoomed = !LB.zoomed;
  const img = $('#lbStage img');
  if (img) img.classList.toggle('zoomed', LB.zoomed);
}
function renderLightbox() {
  const cur = LB.list[LB.idx];
  if (!cur) return;
  const stage = $('#lbStage');
  const meta = $('#lbMeta');
  const counter = $('#lbCounter');
  const isVideo = LB.mode === 'video';
  /* 计数器（只有多个才显示） */
  counter.textContent = LB.list.length > 1 ? (LB.idx + 1) + ' / ' + LB.list.length : '';
  /* 左右按钮 */
  $('#lbPrev').style.display = LB.list.length > 1 ? '' : 'none';
  $('#lbNext').style.display = LB.list.length > 1 ? '' : 'none';
  $('#lbPrev').disabled = LB.idx === 0;
  $('#lbNext').disabled = LB.idx === LB.list.length - 1;
  /* 元信息 */
  meta.innerHTML = '<div class="lb-name">' + esc(cur.file_name || '未命名') + '</div>'
    + '<div class="lb-sub">' + esc(cur.stage || '') + ' · ' + esc(cur.category || '') + ' · ' + fmtSize(cur.size) + '</div>';
  /* 加载签名 URL */
  stage.innerHTML = '<div class="lb-loading">加载中…</div>';
  const cached = ATT_URL[cur.path];
  if (cached) {
    mountMedia(cur, cached, isVideo);
  } else {
    HC_SB.storage.from(BUCKET).createSignedUrl(cur.path, 3600).then(function (r) {
      if (r && r.data && r.data.signedUrl) {
        ATT_URL[cur.path] = r.data.signedUrl;
        /* 防止已切换/关闭 */
        const nowCur = LB.list[LB.idx];
        if (nowCur && nowCur.id === cur.id && $('#lightbox').classList.contains('open')) {
          mountMedia(cur, r.data.signedUrl, isVideo);
        }
      } else {
        stage.innerHTML = '<div class="lb-loading">加载失败，请重试</div>';
      }
    }).catch(function () {
      stage.innerHTML = '<div class="lb-loading">网络异常</div>';
    });
  }
}
function mountMedia(att, url, isVideo) {
  const stage = $('#lbStage');

    v.autoplay = true;
    v.playsInline = true;
    v.preload = 'metadata';
    stage.appendChild(v);

    stage.innerHTML = '';

    img.alt = att.file_name || '';

      lines.push('New-Item -ItemType Directory -Force -Path (Join-Path $root "' + s + '") | Out-Null');
    });
    lines.push('');
  });
  lines.push('Write-Host "目录创建完成" -ForegroundColor Green');
  const blob = new Blob([lines.join('\r\n')], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '创建客户库目录.ps1';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('已导出建库脚本');
}

/* ---------- 21. 启动 ---------- */
function selfTest() {
  try {
    const tests = runSortTests();
    const bad = tests.filter(function (t) { return !t.pass; });
    if (bad.length) console.error('[排序自检失败]', bad);
    else console.log('[排序自检通过]', tests.map(function (t) { return t.name; }).join(' / '));
  } catch (e) { console.warn('排序自检异常', e); }
}
/* ---------- 21. 语音录入（浏览器内置 ASR，免飞书、免企业） ---------- */
const VOICE_ACTIONS = [
  { id: 'followup', label: '加跟进记录' },
  { id: 'status', label: '改客户状态' },
  { id: 'advance', label: '推进阶段' },
  { id: 'briefing', label: '加交底记录' },
  { id: 'material', label: '加主材确认' },
  { id: 'version', label: '加方案版本' },
  { id: 'change', label: '加变更增项' },
];
let voiceState = { recog: null, recording: false, text: '', parsed: null };

function renderVoiceModal() {
  const cOpts = DB.customers.map(function (c) {
    return '<option value="' + c.id + '">' + esc(c.name) + ' · ' + esc(c.community) + '</option>';
  }).join('');
  const aOpts = VOICE_ACTIONS.map(function (a) {
    return '<option value="' + a.id + '">' + a.label + '</option>';
  }).join('');
  const p = voiceState.parsed || {};
  const recBtn = voiceState.recording
    ? '<button class="btn" style="background:#d64545;color:#fff;border-color:#d64545" data-action="voice-stop">⏹ 停止录音</button>'
    : '<button class="btn btn-primary" data-action="voice-start">🎙 开始录音</button>';
  const recDot = voiceState.recording
    ? '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:#e74c3c;margin-right:6px;animation:pulse 1s infinite"></span>录音中…'
    : '';
  /* 浏览器内核提示：Chrome 的 Web Speech 走谷歌服务，国内连接不可用；Edge 走微软服务可用 */
  const ua = navigator.userAgent || '';
  const isEdge = ua.indexOf('Edg/') >= 0 || ua.indexOf('Edge/') >= 0;
  const isChrome = ua.indexOf('Chrome/') >= 0 && !isEdge;
  const voiceTip = isChrome
    ? '<div style="background:#fdf1dc;border:1px solid #f0dcb0;color:#8a5a10;border-radius:9px;padding:9px 12px;font-size:12px;margin-bottom:12px;line-height:1.6">'
      + '⚠ 当前为 Chrome 浏览器，语音转写在国内可能无法连接。建议改用 <b>Edge 浏览器</b>，或按 <b>Win+H</b> 使用系统语音输入直接口述到文本框。AI 精简功能不受影响。</div>'
    : '';
  return '<div class="modal-panel" style="max-width:640px">'
    + '<div class="card-head"><div class="flex-1"><div class="card-title">🎤 语音录入 ' + recDot + '</div>'
    + '<div class="card-sub">点击开始说话，说完自动解析；也可直接手动输入后用 AI 精简。</div></div>'
    + '<button class="btn btn-sm" data-action="close-modal">关闭</button></div>'
    + '<div class="card-body">'
    + voiceTip
    + '<div class="flex gap-2 mb-3">' + recBtn
    + '<button class="btn" data-action="voice-parse">解析文字</button>'
    + '<button class="btn" data-action="voice-polish" title="去重、去口头语，输出书面化文本">✨ AI 精简</button></div>'
    + '<div class="field"><label>识别文字（可手动修改）</label>'
    + '<textarea id="voiceText" class="textarea" rows="4" placeholder="例如：给马先生加条跟进，今天电话确认主材下周一进场，三天后再跟进">' + esc(voiceState.text) + '</textarea></div>'
    + '<div class="grid" style="grid-template-columns:1fr 1fr;gap:0 12px">'
    + '<div class="field"><label>客户</label><select id="v_customer" class="select">' + cOpts + '</select></div>'
    + '<div class="field"><label>操作类型</label><select id="v_action" class="select">' + aOpts + '</select></div>'
    + '</div>'
    + '<div class="field mt-3"><label>内容</label><input id="v_content" class="input" value="' + esc(p.content || '') + '"></div>'
    + '<div class="grid" style="grid-template-columns:1fr 1fr;gap:0 12px">'
    + '<div class="field"><label>下一步动作</label><input id="v_next" class="input" value="' + esc(p.nextAction || '') + '"></div>'
    + '<div class="field"><label>下次跟进日期</label><input id="v_nextdate" class="input" type="date" value="' + (p.nextDate || '') + '"></div>'
    + '</div>'
    + '<div class="flex gap-2 mt-4" style="justify-content:flex-end">'
    + '<button class="btn" data-action="close-modal">取消</button>'
    + '<button class="btn btn-primary" data-action="voice-save">保存</button>'
    + '</div></div></div>';
}

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast('当前浏览器不支持语音识别，请用 Chrome 或 Edge');
    return;
  }
  // 麦克风需要 localhost 或 HTTPS；file:// 双击打开会被浏览器静默拒绝
  if (location.protocol === 'file:') {
    voiceState.recording = false;
    $('#modal').innerHTML = renderVoiceModal();
    toast('麦克风不可用：请双击 start.bat 启动本地服务后再用语音，不要直接双击 index.html');
    return;
  }
  const r = new SR();
  r.lang = 'zh-CN';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onresult = function (e) {
    let t = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) t += e.results[i][0].transcript;
    }
    if (t) {
      voiceState.text = (voiceState.text || '') + t;
      const box = $('#voiceText');
      if (box) box.value = voiceState.text;
    }
  };
  r.onerror = function (e) {
    const errMap = {
      'not-allowed': '麦克风被浏览器拒绝，请在地址栏点锁图标 → 允许麦克风',
      'service-not-allowed': '语音服务不可用，请检查网络或换用 Chrome / Edge',
      'no-speech': '没检测到声音，请靠近麦克风再试',
      'audio-capture': '找不到麦克风设备',
      'network': '网络错误，语音识别需要联网',
    };
    toast('录音出错：' + (errMap[e.error] || e.error));
    voiceState.recording = false;
    $('#modal').innerHTML = renderVoiceModal();
  };
  // 自动续接：说话停顿导致识别结束时，若用户还没点停止，自动重启
  r.onend = function () {
    if (voiceState.recording && voiceState.recog === r) {
      try { r.start(); } catch (e) { voiceState.recording = false; }
    } else {
      voiceState.recording = false;
    }
  };
  voiceState.recog = r;
  voiceState.recording = true;
  // 不清空已有文字，支持多次录音追加
  r.start();
  $('#modal').innerHTML = renderVoiceModal();
  toast('正在聆听…说完点「停止录音」');
}

function stopVoice() {
  voiceState.recording = false;
  if (voiceState.recog) {
    try { voiceState.recog.stop(); } catch (e) {}
    voiceState.recog = null;
  }
  $('#modal').innerHTML = renderVoiceModal();
  parseVoiceText();
}

/* 语音转写 → 书面化精简：去口头填充词、去重复句、合并输出 */
const VOICE_FILLERS = [
  '嗯', '啊', '呃', '额', '诶', '哦', '噢', '唔', '哎',
  '那个', '这个', '然后呢', '然后', '就是说', '就是吧', '对吧', '你知道吧',
  '怎么说呢', '反正', '其实', '基本上', '对对对', '好好好', '行行行', '哦哦',
  '那什么', '你看', '我跟你说', '这么着', '接着', '再就是'
];
function aiPolishText(raw) {
  let t = String(raw || '').replace(/\s+/g, '');
  if (!t) return '';
  // 1. 去掉口头填充词
  VOICE_FILLERS.forEach(function (f) { t = t.split(f).join(''); });
  // 2. 断句
  const parts = t.split(/[。！？!?；;，,\n\r、]+/)
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 1; });
  // 3. 去重：规范化后相同或互相包含的句子只保留更完整的一条
  const kept = [];
  parts.forEach(function (p) {
    const norm = p.replace(/[的了呢吧啊哦啦嘛呀着过]/g, '');
    if (norm.length < 2) return;
    for (let i = 0; i < kept.length; i++) {
      const k = kept[i].norm;
      if (k === norm) return;
      if (k.indexOf(norm) >= 0) return;
      if (norm.indexOf(k) >= 0) { kept[i] = { text: p, norm: norm }; return; }
    }
    kept.push({ text: p, norm: norm });
  });
  // 4. 合并成书面化短句
  let out = kept.map(function (k) { return k.text; }).join('；');
  out = out.replace(/^[；，,。、]+/, '').replace(/[；，,、]+$/, '');
  if (out && !/[。！？]$/.test(out)) out += '。';
  return out;
}

/* 规则解析：从语音文字中提取客户、操作类型、内容、下一步、日期 */
function parseVoiceText() {
  const text = ($('#voiceText') || {}).value || voiceState.text || '';
  if (!text.trim()) { toast('没有可解析的文字'); return; }
  voiceState.text = text;
  const p = { content: text, nextAction: '', nextDate: '' };

  // 1. 匹配客户（姓名 / 小区）
  let best = null, bestScore = 0;
  DB.customers.forEach(function (c) {
    let s = 0;
    if (text.indexOf(c.name) >= 0) s += 10;
    if (c.community && text.indexOf(c.community) >= 0) s += 5;
    if (s > bestScore) { bestScore = s; best = c; }
  });
  if (best) p.customerId = best.id;

  // 2. 操作类型（"加条跟进" 优先级最高，避免被主材/方案等关键词覆盖）
  if (/加.{0,2}跟进|跟进记录|联系了|沟通了/.test(text)) p.action = 'followup';
  else if (/流失|丢了|不做了/.test(text)) p.action = 'status';
  else if (/沉睡|唤醒|恢复正常/.test(text)) p.action = 'status';
  else if (/推进|到.{1,4}阶段|阶段/.test(text)) p.action = 'advance';
  else if (/交底/.test(text)) p.action = 'briefing';
  else if (/主材|瓷砖|地板|橱柜|木门|卫浴|下单/.test(text)) p.action = 'material';
  else if (/方案|版本|改图|图纸/.test(text)) p.action = 'version';
  else if (/变更|增项|加项/.test(text)) p.action = 'change';
  else p.action = 'followup';

  // 3. 提取日期：优先"X天后/下次跟进"，其次相对日期词
  const cnNum = { '一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
  let dn = text.match(/(\d+)\s*天(后|之后)/);
  if (dn) {
    p.nextDate = shift(Number(dn[1]));
  } else {
    dn = text.match(/([一二两三四五六七八九十])\s*天(后|之后)/);
    if (dn) p.nextDate = shift(cnNum[dn[1]] || 3);
  }
  if (!p.nextDate) {
    const dateMap = { '今天': 0, '明天': 1, '后天': 2, '大后天': 3 };
    const dm = text.match(/(明天|后天|大后天|下周一|下周二|下周三|下周四|下周五|下周六|下周日)/);
    if (dm) {
      const k = dm[1];
      if (dateMap[k] !== undefined) p.nextDate = shift(dateMap[k]);
      else {
        const wd = { '下周一': 1, '下周二': 2, '下周三': 3, '下周四': 4, '下周五': 5, '下周六': 6, '下周日': 0 }[k];
        if (wd !== undefined) {
          const now = new Date();
          const cur = now.getDay();
          let diff = (wd - cur + 7) % 7;
          if (diff === 0) diff = 7;
          p.nextDate = fmtD(new Date(now.getTime() + diff * 86400000));
        }
      }
    }
  }
  if (!p.nextDate) p.nextDate = shift(3);

  // 4. 下一步动作（截取"下次"/"之后"/"再"后面的内容）
  const nm = text.match(/(?:下次|之后|再|回头|稍后)([^。！？；\n]{2,20})/);
  if (nm) p.nextAction = nm[1].trim();

  // 5. AI 精简：去重去口头语，输出书面化文本
  const polished = aiPolishText(text);
  if (polished) p.content = polished;

  voiceState.parsed = p;
  $('#modal').innerHTML = renderVoiceModal();
  if (p.customerId) $('#v_customer').value = p.customerId;
  $('#v_action').value = p.action;
  toast('解析完成：' + (VOICE_ACTIONS.filter(function(a){return a.id===p.action;})[0]||{}).label);

  // 已配置豆包：再用大模型做一次语义级精简
  if (aiCfg().key) {
    const box0 = $('#v_content');
    if (box0) box0.value = 'AI 整理中…';
    aiPolishSmart(text).then(function (r) {
      voiceState.parsed.content = r.text;
      const keepC = ($('#v_customer') || {}).value || p.customerId;
      const keepA = ($('#v_action') || {}).value || p.action;
      $('#modal').innerHTML = renderVoiceModal();
      if (keepC) $('#v_customer').value = keepC;
      if (keepA) $('#v_action').value = keepA;
      toast(r.note);
    });
  }
}

function saveVoiceEntry() {
  const cid = $('#v_customer').value;
  const action = $('#v_action').value;
  const content = $('#v_content').value.trim();
  const nextAction = $('#v_next').value.trim();
  const nextDate = $('#v_nextdate').value;
  const c = cust(cid);
  if (!c) { toast('请选择客户'); return; }

  if (action === 'followup') {
    if (!content) { toast('内容不能为空'); return; }
    DB.followUps.push({
      id: 'F' + Date.now(), customerId: cid, date: TODAY,
      updated_at: new Date().toISOString(),
      type: '电话', content: content, nextAction: nextAction || '待跟进',
      nextFollowDate: nextDate || shift(3), operator: '本人'
    });
    c.lastFollowDate = TODAY;
    c.nextFollowDate = nextDate || shift(3);
    toast('已添加跟进：' + c.name);
  } else if (action === 'status') {
    let st = '正常';
    if (/流失/.test(content)) st = '流失';
    else if (/沉睡/.test(content)) st = '沉睡';
    else if (/唤醒|恢复/.test(content)) st = '正常';
    c.status = st;
    if (st === '正常') { c.lastFollowDate = TODAY; c.nextFollowDate = shift(3); }
    toast(c.name + ' 状态 → ' + st);
  } else if (action === 'advance') {
    const g = gateInfo(c.stage);
    if (!g) { toast('已是最后阶段'); return; }
    const miss = missingFields(c, g.need);
    const force = /强制|跳过|硬推|直接推/.test(content);
    if (miss.length && !force) { toast('门禁未通过：缺 ' + miss.map(function(m){return m[1];}).join('、') + '。内容里加「强制」二字可跳过。'); return; }
    c.stage = g.to; c.stageEnterDate = TODAY;
    toast(c.name + (force ? '（强制）' : '') + ' 已推进到 ' + g.to);
  } else if (action === 'briefing') {
    const node = /拆除|水电|木工|瓦工|油工|竣工/.exec(content);
    DB.briefings.push({
      id: 'B' + Date.now(), customerId: cid,
      node: node ? node[0] + '交底' : '交底', date: TODAY,
      attendees: '业主 / 项目经理', confirmed: content, issues: '',
      drawingVersion: c.planVersion || '', signed: '是', voucher: ''
    });
    toast('已添加交底记录：' + c.name);
  } else if (action === 'material') {
    const cat = /瓷砖|地板|橱柜|木门|卫浴|吊顶|灯具|五金|石材/.exec(content);
    DB.materials.push({
      id: 'M' + Date.now(), customerId: cid,
      category: cat ? cat[0] : '主材', brand: '', spec: content,
      orderDate: /下单/.test(content) ? TODAY : null, arriveDate: null, status: /下单/.test(content) ? '已下单' : '待确认'
    });
    toast('已添加主材确认：' + c.name);
  } else if (action === 'version') {
    const vn = /v?(\d+)/i.exec(content);
    DB.versions.push({
      id: 'V' + Date.now(), customerId: cid,
      version: vn ? 'v' + vn[1] : 'v' + (DB.versions.filter(function(x){return x.customerId===cid;}).length + 1),
      date: TODAY, summary: content, status: '已交付', link: ''
    });
    c.planVersion = vn ? 'v' + vn[1] : c.planVersion;
    toast('已添加方案版本：' + c.name);
  } else if (action === 'change') {
    const am = /(\d+\.?\d*)\s*万|(\d+\.?\d*)\s*元/.exec(content);
    DB.changes.push({
      id: 'C' + Date.now(), customerId: cid, date: TODAY,
      content: content, amount: am ? (am[1] ? Number(am[1]) * 10000 : Number(am[2])) : 0,
      confirmed: '是', voucher: '', impactDays: 0
    });
    toast('已添加变更增项：' + c.name);
  }

  saveDB();
  $('#modal').classList.remove('open');
  state.drawerId = cid;
  render();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('已导出 data.json');
}

function boot() {
  const done = function () {
    SYNC_LOCK = false;
    const rb = document.getElementById('btnReset');
    if (rb) {
      /* 危险操作：云端模式下普通租户直接隐藏该按钮 */
      if (CLOUD_ON && !isAdmin()) { rb.style.display = 'none'; }
      else { rb.textContent = CLOUD_ON ? '清空全部数据' : '重置演示数据'; }
    }
    selfTest(); render();
  };

  initSupabase(function () {
    /* A. 云端模式：先取身份/角色，再以云端为准 */
    if (CLOUD_ON && HC_SB) {
      loadMe(function () {
        if (ME && ME.tenant_status === 'disabled' && !isAdmin()) {
          showBlocked(ME.tenant_name);
          return;
        }
        /* 缓存必须在 loadMe 之后按租户 key 读取，避免串租户 */
        let cached = null;
        try {
          const raw = localStorage.getItem(lsKey());
          if (raw) cached = JSON.parse(raw);
        } catch (e) { /* 私有模式可能不可用 */ }
        cloudPull(function (st) {
          if (st === 'ok') { done(); return; }
          if (st === 'empty') {
            /* 新注册租户：从空白工作区开始，绝不注入演示数据 */
            DB = emptyDB();
            saveDB();
          } else {
            /* 读取失败：只回退到本租户自己的缓存，绝不覆盖云端 */
            DB = cached || emptyDB();
            toast('云端读取失败，已使用本地缓存，未覆盖云端数据');
          }
          done();
        });
      });
      return;
    }

    /* B. 本机模式：缓存 → data.json → 演示数据 */
    let cached = null;
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) cached = JSON.parse(raw);
    } catch (e) { /* 私有模式可能不可用 */ }
    if (cached) { DB = cached; done(); return; }

    if (typeof fetch === 'function') {
      fetch('data.json', { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('no data.json');
          return r.json();
        })
        .then(function (j) {
          if (j && j.customers && j.customers.length) { DB = j; }
          else throw new Error('data.json 结构不符');
        })
        .catch(function () { DB = buildMock(); })
        .then(done);
    } else {
      DB = buildMock();
      done();
    }
  });
}
boot();
