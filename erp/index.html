<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>恒彩 · 客户跟进与交付系统 V1.0.0</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f3f6f4; --card:#fff; --line:#e2e8e4; --ink:#1b2724; --muted:#6d7b76;
  --primary:#0f3d33; --primary-2:#1a5c4b; --primary-soft:#e7f2ee;
  --danger:#b9382c; --danger-soft:#fdecea; --warn:#a3701c; --warn-soft:#fff4df;
  --ok:#1c7355; --ok-soft:#e5f5ee;
  --shadow:0 1px 2px rgba(16,40,34,.06),0 8px 24px rgba(16,40,34,.05);
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary-2);text-decoration:none}

/* ============ Tailwind 风格工具类（已编译内联，离线可用） ============ */
.flex{display:flex}.grid{display:grid}.block{display:block}.hidden{display:none}
.relative{position:relative}.absolute{position:absolute}
.items-center{align-items:center}.items-start{align-items:flex-start}
.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.flex-col{flex-direction:column}.flex-1{flex:1 1 0%;min-width:0}.flex-wrap{flex-wrap:wrap}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}
.p-2{padding:8px}.p-3{padding:12px}.p-4{padding:16px}.p-5{padding:20px}
.px-3{padding-left:12px;padding-right:12px}.px-4{padding-left:16px;padding-right:16px}
.py-2{padding-top:8px;padding-bottom:8px}.py-3{padding-top:12px;padding-bottom:12px}
.py-4{padding-top:16px;padding-bottom:16px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.mb-6{margin-bottom:24px}
.w-full{width:100%}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text-center{text-align:center}.text-right{text-align:right}
.text-xs{font-size:12px}.text-sm{font-size:13px}.text-base{font-size:14px}
.text-lg{font-size:18px}.text-xl{font-size:22px}.text-2xl{font-size:26px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
.rounded{border-radius:8px}.rounded-lg{border-radius:12px}.rounded-xl{border-radius:16px}
.border{border:1px solid var(--line)}.shadow{box-shadow:var(--shadow)}
.cursor-pointer{cursor:pointer}.overflow-hidden{overflow:hidden}.overflow-auto{overflow:auto}
.whitespace-pre-wrap{white-space:pre-wrap;word-break:break-word}
.text-muted{color:var(--muted)}.text-main{color:var(--ink)}
.text-danger{color:var(--danger)}.text-warn{color:var(--warn)}.text-ok{color:var(--ok)}
.text-primary{color:var(--primary-2)}.text-white{color:#fff}
.bg-card{background:var(--card)}.bg-page{background:var(--bg)}
.bg-danger-soft{background:var(--danger-soft)}.bg-warn-soft{background:var(--warn-soft)}
.bg-ok-soft{background:var(--ok-soft)}.bg-primary-soft{background:var(--primary-soft)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ============ 布局 ============ */
.app{display:block;min-height:100vh}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:236px;z-index:40;
  background:linear-gradient(170deg,#0e3a30,#0b2f27 60%,#0a2a23);
  color:#e8f1ee;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .22s ease;
}
body.nav-open .sidebar{transform:translateX(0)}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{
  width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  font-size:16px;font-weight:700;letter-spacing:1px;color:#fff;
}
.brand-name{font-size:13px;font-weight:600;line-height:1.3;color:#fff}
.brand-sub{font-size:11px;color:#9fc4b8;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
.nav-group{margin-top:12px}
.nav-group-t{font-size:11px;color:#87ab9f;padding:6px 10px;letter-spacing:.5px}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  color:#cfe2db;padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer;
  text-align:left;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.nav-item .ico{width:18px;text-align:center;flex:none;opacity:.85;font-size:14px}
.nav-item .cnt{
  margin-left:auto;font-size:11px;color:#a9c8bd;background:rgba(255,255,255,.1);
  border-radius:20px;padding:0 7px;min-width:20px;text-align:center;line-height:18px;
}
.nav-item.active .cnt{background:rgba(255,255,255,.22);color:#fff}
.side-foot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#9fc4b8}
.side-foot-t{font-weight:600;color:#fff;font-size:12px;margin-bottom:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#35d39a;margin-right:6px;box-shadow:0 0 0 3px rgba(53,211,154,.14)}
.main{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-title{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px}
.search{
  width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
  background:#fff;font-size:12px;outline:none;
}
.search:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(26,92,75,.1)}
.icon-btn{
  border:1px solid var(--line);background:#fff;border-radius:9px;width:36px;height:34px;
  display:none;place-items:center;cursor:pointer;font-size:16px;
}
.view{padding:14px;flex:1}
@media (min-width:900px){
  body.nav-open .sidebar{transform:none}
  .sidebar{transform:none;width:240px}
  .main{margin-left:240px}
  .icon-btn.mobile-only{display:none!important}
  .view{padding:20px 24px 40px;max-width:1180px}
  .search{width:220px}
}
@media (max-width:899px){
  .icon-btn.mobile-only{display:grid}
  .topbar-right .search{width:110px}
  .topbar-right .btn-primary{padding:7px 10px;font-size:12px}
}

/* ============ 组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-title{font-size:14px;font-weight:600}
.card-sub{font-size:12px;color:var(--muted)}
.card-body{padding:14px 16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:13px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .06s;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn:hover{background:#f7faf9}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.25);color:#dfeee9}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;
  font-size:11px;line-height:19px;white-space:nowrap;
}
.badge-primary{background:var(--primary-soft);color:var(--primary-2)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-grey{background:#eef1f0;color:#5d6b66}
.stat{padding:14px 16px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.stat .lab{font-size:12px;color:var(--muted)}
.stat .num{font-size:24px;font-weight:700;line-height:1.25;margin-top:2px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:2px}
.stat.hot{background:linear-gradient(160deg,#0f3d33,#1a5c4b);border-color:transparent;color:#fff}
.stat.hot .lab,.stat.hot .sub{color:#a9cbbf}
.stat.danger .num{color:var(--danger)}
.stat.warn .num{color:var(--warn)}
.row{
  display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .13s;
}
.row:last-child{border-bottom:0}
.row:hover{background:#f8fbfa}
.row-main{flex:1;min-width:0}
.row-t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-created{font-size:10.5px;color:#b0b0b0;margin-bottom:1px;letter-spacing:.3px}
.row-s{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-right{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:13px}
.section-t{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;font-weight:600}
.grid-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid-stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.grid-stats{grid-template-columns:repeat(4,1fr)}.grid-stats4{grid-template-columns:repeat(4,1fr)}}
.stagebar{display:flex;gap:4px;flex-wrap:wrap}
.stagechip{
  flex:1;min-width:56px;text-align:center;padding:7px 6px;border-radius:8px;
  background:#f1f5f3;border:1px solid var(--line);font-size:11px;
  cursor:pointer;transition:.15s;
}
.stagechip:hover{background:#e3ede9;border-color:var(--primary-2)}
.stagechip b{display:block;font-size:13px;color:var(--primary-2)}
.stagechip.cur{background:var(--primary);border-color:var(--primary);color:#fff}
.stagechip.cur b{color:#fff}

/* 提醒卡 */
.morning{
  border-radius:var(--r);border:1px solid #f1dcb8;
  background:linear-gradient(160deg,#fff9ef,#fff3e2);padding:14px 16px;
}
.morning-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{
  background:#fff;border:1px solid #f0d9b4;border-radius:9px;padding:3px 10px;
  font-size:16px;font-weight:700;color:#8a5a10;font-variant-numeric:tabular-nums;
}
.morning-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #f0e0c4;font-size:12.5px}
.morning-item:last-child{border-bottom:0}
.morning-item .t{flex:none;color:#8a5a10;font-weight:600;font-size:11.5px;min-width:42px}
.morning-item .d{flex:1;min-width:0;color:#4a3a22}

/* 抽屉 */
.drawer{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(10,24,20,.36);
}
.drawer.open{display:block}
.drawer-panel{
  position:absolute;right:0;top:0;bottom:0;width:100%;max-width:520px;
  background:#fff;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12);
}
@media (min-width:700px){.drawer-panel{border-radius:16px 0 0 16px}}
.drawer-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer-body{flex:1;overflow:auto;padding:14px 16px 40px}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{min-width:0;word-break:break-word}
.grp-t{font-size:12px;font-weight:600;color:var(--primary-2);margin:16px 0 8px;padding-left:8px;border-left:3px solid var(--primary-2)}
.sub-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fbfdfc}
.modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(10,24,20,.4);padding:16px;overflow:auto}
.modal.open{display:block}
.modal-panel{max-width:560px;margin:24px auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.input,.select,.textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:#fff;font-size:13px;outline:none;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(26,92,75,.1)}
.textarea{min-height:120px;resize:vertical;line-height:1.6}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;
  background:#123a31;color:#fff;padding:9px 16px;border-radius:22px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;cursor:pointer;
}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.out{
  background:#0f2721;color:#d8efe7;border-radius:10px;padding:12px;font-size:12.5px;
  white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;line-height:1.7;
}
.pathbox{
  background:#f5f8f7;border:1px dashed #cfdcd6;border-radius:9px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre-wrap;
  color:#3c4d47;line-height:1.7;
}
.crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.hr{height:1px;background:var(--line);margin:14px 0}
.copy-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{font-size:11px;color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">恒</div>
      <div class="flex-1">
        <div class="brand-name">客户跟进与交付</div>
        <div class="brand-sub">恒彩设计部 · V1.0.0</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="side-foot-t">自动提醒</div>
      <div class="side-foot-s"><span class="dot"></span>每日 09:10 晨间汇总</div>
      <div class="side-foot-s text-muted mt-1">各设计师负责自己的客户 · 无公海池</div>
      <button class="btn btn-ghost btn-sm mt-3" data-action="reset">重置演示数据</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn mobile-only" data-action="toggle-nav">☰</button>
      <div class="topbar-title" id="topTitle">今日工作台</div>
      <div class="topbar-right">
        <input id="search" class="search" placeholder="搜索客户 / 小区">
        <button class="btn btn-primary btn-sm" data-action="voice-entry" title="语音录入跟进">🎤 语音</button>
        <button class="btn btn-sm" data-action="export-json" title="导出 data.json">⬇ 导出</button>
        <button class="btn btn-sm" data-action="logout" title="锁定并退出">🔒 锁定</button>
        <button class="btn btn-primary btn-sm" data-action="new-customer">+ 客户</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>
</div>

<div id="drawer" class="drawer"></div>
<div id="modal" class="modal"></div>
<div id="toast" class="toast"></div>
<script src="config.js"></script>

<script>
/* ---------- 0. 登录门禁 ----------
 * 未登录直接跳 login.html（线上 http/https 生效；本地 file:// 自用不拦）
 * 登录态存在 hc_session；云端模式再由 Supabase 校验会话有效性。
 */
(function () {
  try {
    var isHttp = /^http/.test(location.protocol);
    if (!isHttp) return;
    var raw = localStorage.getItem('hc_session');
    var s = raw ? JSON.parse(raw) : null;
    if (!s || !s.u) { location.replace('login.html'); }
  } catch (e) { /* 存储不可用时放行，避免白屏 */ }
})();
</script>
<script>
/* =====================================================================
 * 恒彩客户跟进与交付系统 V1.0.0
 * 单文件可运行：HTML + 内联 Tailwind 子集 + 原生 JS
 * 数据：本地 Mock / 飞书多维表格导出 JSON（见 02_部署说明）
 * ===================================================================== */

/* ---------- 1. 基础工具 ---------- */
const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.prototype.slice.call(document.querySelectorAll(s));

const TODAY_D = new Date();
TODAY_D.setHours(0, 0, 0, 0);
const TODAY = fmtD(TODAY_D);

function fmtD(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}
function shift(n, base) {
  const d = new Date(base || TODAY_D);
  d.setDate(d.getDate() + n);
  return fmtD(d);
}
function diffDays(a, b) { // a - b，正数表示 a 在 b 之后
  if (!a || !b) return null;
  return Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}
function money(n) {
  if (n == null || n === '') return '—';
  if (n >= 10000) return (n / 10000).toFixed(n % 10000 === 0 ? 0 : 1) + ' 万';
  return n.toLocaleString('zh-CN');
}
function sum(arr, key) {
  return arr.reduce((a, b) => a + (Number(b[key]) || 0), 0);
}

/* ---------- 2. 业务元数据 ---------- */
const STAGES = [
  { code: 'S0', name: '线索进线' },
  { code: 'S1', name: '邀约确认' },
  { code: 'S2', name: '上门量房' },
  { code: 'S3', name: '需求报告' },
  { code: 'S4', name: '方案迭代' },
  { code: 'S5', name: '报价核对' },
  { code: 'S6', name: '定金阶段' },
  { code: 'S7', name: '合同签订' },
  { code: 'S8', name: '开工筹备' },
  { code: 'S9', name: '施工管控' },
  { code: 'S10', name: '竣工售后' }
];
const STAGE_IDX = {};
STAGES.forEach((s, i) => { STAGE_IDX[s.code] = i; });

const STAGE_MAP = {};
STAGES.forEach((s) => { STAGE_MAP[s.code] = s.name; });

/* 阶段门禁：上一阶段必须齐备的字段，不齐不得流转 */
const GATES = [
  { from: 'S0', to: 'S1', need: [['source', '线索来源'], ['firstContact', '初次沟通记录']] },
  { from: 'S1', to: 'S2', need: [['visitApptDate', '邀约量房时间'], ['attendees', '到场人员']] },
  { from: 'S2', to: 'S3', need: [['measureDate', '量房日期'], ['siteLink', '现场资料链接']] },
  { from: 'S3', to: 'S4', need: [['reportDeliverDate', '量房报告交付日期'], ['clientFeedback', '客户反馈']] },

/* ---------- 5. 存储层（本地缓存 + 云端同步） ---------- */
const LS_KEY = 'hl_followup_v1';
let DB = null;

/* 云端（Supabase）配置，见 config.js */
const HC_CFG = window.HC_CONFIG || {};
const CLOUD_ON = !!(HC_CFG.SUPABASE_URL && HC_CFG.SUPABASE_ANON_KEY);
let HC_SB = null;
let pushTimer = null;

function initSupabase(cb) {
  if (!CLOUD_ON) { cb(); return; }
  function make() {
    try {
      HC_SB = window.supabase.createClient(HC_CFG.SUPABASE_URL, HC_CFG.SUPABASE_ANON_KEY);
    } catch (e) { HC_SB = null; }
    cb();
  }
  if (window.supabase) { make(); return; }
  const s = document.createElement('script');
  s.src = 'vendor/supabase.js';
  s.onload = make;
  s.onerror = function () {
    const s2 = document.createElement('script');
    s2.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    s2.onload = make;
    s2.onerror = function () { cb(); };
    document.head.appendChild(s2);
  };
  document.head.appendChild(s);
}

function saveDB() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
  } catch (e) {
    toast('本地缓存失败：' + (e.name === 'QuotaExceededError' ? '存储已满，请导出后清理' : e.message));
  }
  if (CLOUD_ON && HC_SB) schedulePush();
  return true;
}

function schedulePush() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(cloudPush, 700);
}

function cloudPush() {
  if (!HC_SB) return;
  HC_SB.auth.getUser().then(function (r) {
    const u = r && r.data ? r.data.user : null;
    if (!u) return;
    HC_SB.from('hc_data').upsert({
      user_id: u.id,
      payload: DB,
      updated_at: new Date().toISOString()
    }).then(function (res) {
      if (res && res.error) {
        console.warn('[云同步] 写入失败：', res.error.message);
        toast('云端保存失败：' + res.error.message);
      }
    });
  });
}

function cloudPull(cb) {
  if (!HC_SB) { cb(false); return; }
  HC_SB.auth.getSession().then(function (r) {
    const s = r && r.data ? r.data.session : null;
    if (!s) { location.replace('login.html'); return; }
    HC_SB.from('hc_data').select('payload').eq('user_id', s.user.id).maybeSingle().then(function (res) {
      if (res && res.data && res.data.payload && res.data.payload.customers) {
        DB = res.data.payload;
        cb(true);
      } else {
        cb(false);
      }
    }).catch(function () { cb(false); });
  });
}

function resetDB() {
  DB = buildMock();
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  saveDB();
}

function changeAmount(c) { return sum(DB.changes.filter((x) => x.customerId === c.id), 'amount'); }

/* ---------- 6.1 沉睡自动判定（Q9） ----------
 * 阈值集中在这里，改一处即全局生效，同步改 01_飞书配置说明书 的公式常量。
 * 逻辑：距「上次跟进日」的天数（无则回退到建档日）
 *   ≥60 天 → 沉睡候选
 *   ≥30 天 且 非期房 → 沉默预警（期房客户等交房周期长，不参与预警，避免天天报警）
 */
const SLEEP_WARN_DAYS = 30;
const SLEEP_DAYS = 60;

function lastTouch(c) { return c.lastFollowDate || c.createdDate || null; }
function silenceDays(c) {
  const d = lastTouch(c);
  if (!d) return 0;
  const n = diffDays(TODAY, d);
  return n > 0 ? n : 0;
}
function isSleepCandidate(c) {
  if (c.status === '沉睡' || c.status === '流失' || c.status === '竣工归档') return false;
  if (c.stage === 'S10') return false;
  return silenceDays(c) >= SLEEP_DAYS;
}
/* 返回 normal / warn / sleep */
function sleepLevel(c) {
  if (c.status === '沉睡') return 'sleep';
  if (c.status === '流失' || c.status === '竣工归档') return 'normal';
  if (c.stage === 'S10') return 'normal';
  if (isSleepCandidate(c)) return 'sleep';
  if (c.houseStatus !== '期房' && silenceDays(c) >= SLEEP_WARN_DAYS) return 'warn';
  return 'normal';
}
function sleepBadge(c) {
  const lv = sleepLevel(c);
  if (lv === 'sleep') return '<span class="badge badge-grey">☾ 沉睡</span>';
  if (lv === 'warn') return '<span class="badge badge-warn">沉默 ' + silenceDays(c) + ' 天</span>';
  return '';
}
function sleepingPool() {
  return DB.customers.filter(function (c) {
    return c.status === '沉睡' || isSleepCandidate(c);
  });
}
function stageBadge(c) {
  const cls = c.stage === 'S10' ? 'badge-ok' : (STAGE_IDX[c.stage] >= 6 ? 'badge-primary' : 'badge-grey');
  return '<span class="badge ' + cls + '">' + c.stage + ' ' + STAGE_MAP[c.stage] + '</span>';
}
function intentBadge(v) {
  const map = { '高': 'badge-danger', '中': 'badge-warn', '低': 'badge-grey', '观望': 'badge-grey', '比价': 'badge-warn' };
  return '<span class="badge ' + (map[v] || 'badge-grey') + '">' + esc(v) + '</span>';
}

/* ---------- 7. 排序引擎（修复原图「下次跟进日期」排序 bug） ---------- */
/**
 * 规则：
 * 1) 空日期置底
 * 2) 逾期置顶（组内仍升序）
 * 3) 日期升序（ISO 字符串比较，杜绝 8.24/8.14 混用）
 * 4) 同日期 → 阶段序号升序 → 建档日升序（稳定）
 */
function sortCustomers(list, today) {
  const t = today || TODAY;
  return list.slice().sort(function (a, b) {
    const ad = a.nextFollowDate, bd = b.nextFollowDate;
    if (!ad && !bd) return tieBreak(a, b);
    if (!ad) return 1;
    if (!bd) return -1;
    const ao = ad < t, bo = bd < t;
    if (ao !== bo) return ao ? -1 : 1;
    if (ad < bd) return -1;
    if (ad > bd) return 1;
    return tieBreak(a, b);
  });
}
function tieBreak(a, b) {
  const ai = STAGE_IDX[a.stage] || 0, bi = STAGE_IDX[b.stage] || 0;
  if (ai !== bi) return ai - bi;
  const ac = a.createdDate || '', bc = b.createdDate || '';
  return ac < bc ? -1 : (ac > bc ? 1 : 0);
}

function ruleItems() {
  const out = [];
  DB.customers.forEach(function (c) {
    if (c.status === '流失' || c.status === '沉睡') return; // 沉睡客户由季度唤醒统一处理
    EVENT_RULES.forEach(function (r) {
      if (r.stages && r.stages.indexOf(c.stage) < 0) return; // 提醒仅在其所属阶段生效
      const due = r.due(c);
      if (!due) return;
      if (r.done && r.done(c)) return; // 已完成的节点不再提醒
      out.push({ code: r.code, rule: r.name, cid: c.id, due: due, title: r.title(c), detail: r.detail(c) });
    });
  });
  return out;
}
function dueState(due) {
  const d = diffDays(due, TODAY);
  if (d < 0) return { k: 'over', label: '逾期 ' + (-d) + ' 天', cls: 'badge-danger' };
  if (d === 0) return { k: 'today', label: '今日', cls: 'badge-warn' };
  if (d <= 7) return { k: 'soon', label: d + ' 天后', cls: 'badge-primary' };
  return { k: 'later', label: d + ' 天后', cls: 'badge-grey' };
}
function todaysReminders() {
  return ruleItems().filter(function (it) {
    const d = diffDays(it.due, TODAY);
    return d >= 0 && d <= 0;
  });
}
function upcomingReminders() {
  return ruleItems().filter(function (it) {
    const d = diffDays(it.due, TODAY);
    return d > 0 && d <= 7;
  });
}
function overdueReminders() {
  return ruleItems().filter(function (it) { return diffDays(it.due, TODAY) < 0; });
}

const AI_RULES = {
  need: ['喜欢', '想要', '希望', '需要', '要求', '偏好', '考虑', '打算', '习惯', '家里有', '在意', '关注'],
  revise: ['改', '调整', '换', '不要', '去掉', '加', '太大', '太小', '不合适', '不喜', '重做', '挪'],
  dispute: ['不同意', '争议', '分歧', '吵', '意见不合', '坚持', '反对', '不肯'],
  todo: ['明天', '下周', '约', '安排', '确认', '发我', '给到', '对接', '进场', '下单', '什么时候', '几点'],
  concern: ['担心', '怕', '贵', '超预算', '预算', '犹豫', '再考虑', '比较', '对比', '别家', '后悔', '售后', '不放心', '坑']
};
function distill(text) {
  const sentences = String(text || '')
    .split(/[。！？!?；;\n\r]/)
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 1; });
  const buckets = { need: [], revise: [], dispute: [], todo: [], concern: [] };
  sentences.forEach(function (s) {
    Object.keys(AI_RULES).forEach(function (k) {
      if (AI_RULES[k].some(function (w) { return s.indexOf(w) >= 0; })) buckets[k].push(s);
    });
  });
  return { sentences: sentences.length, buckets: buckets };
}
const AI_LABELS = { need: '需求点', revise: '修改意见', dispute: '争议点', todo: '待办事项', concern: '客户顾虑' };

function gateInfo(stage) {
  const g = GATES.filter(function (x) { return x.from === stage; })[0];
  if (!g) return null;
  return g;
}
function missingFields(c, need) {
  return need.filter(function (n) {
    const v = c[n[0]];
    return v == null || v === '' || v === 0;
  });
}
function renderDrawer(id) {
  const c = cust(id);
  if (!c) return '';
  const g = gateInfo(c.stage);
  const miss = g ? missingFields(c, g.need) : [];
  const nextStage = g ? g.to : null;

  const kv = function (k, v, hint) {
    return '<div class="k">' + esc(k) + '</div><div class="v">' + (v == null || v === '' ? '<span class="text-muted">待补</span>' : esc(v)) + (hint ? ' <span class="mini">' + esc(hint) + '</span>' : '') + '</div>';
  };

  /* 合同附件上传字段（支持图片/文件，多文件） */
  const fileField = function (key, label) {
    const files = Array.isArray(c[key]) ? c[key] : [];
    let items = '';
    files.forEach(function (f, i) {
      const isImg = /^data:image\//.test(f.dataUrl || '');
      const thumb = isImg
        ? '<img src="' + f.dataUrl + '" style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0">'
        : '<div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#f1f5f3;border-radius:6px;font-size:16px;flex-shrink:0">📄</div>';
      items += '<div class="flex items-center gap-2 mb-1">'
        + thumb
        + '<div class="flex-1 mini truncate">' + esc(f.name || '未命名') + '</div>'
        + '<button class="btn btn-sm" style="color:#d64545;border-color:#e8c4c4" onclick="removeContractFile(\'' + c.id + '\',\'' + key + '\',' + i + ')">删除</button>'
        + '</div>';
    });
    return '<div class="field" style="margin-bottom:8px"><label>' + esc(label) + '（' + files.length + '）</label>'
      + '<div>' + items + '</div>'
      + '<label class="btn btn-sm" style="margin-top:2px;cursor:pointer">'
      + '📎 上传文件/图片'
      + '<input type="file" multiple accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.zip,.rar" style="display:none" onchange="uploadContractFile(\'' + c.id + '\',\'' + key + '\',this)">'
      + '</label></div>';
  };

  let html = '<div class="drawer-panel">'
    + '<div class="drawer-head">'
    + '<div class="flex-1"><div class="flex gap-2 items-center flex-wrap"><span class="text-lg font-semibold">' + esc(c.name) + '</span>'

    + kv('联系电话', c.phone) + kv('小区', c.community) + kv('面积 / 户型', c.area + '㎡ / ' + c.layout)
    + kv('房态', c.houseStatus) + kv('线索来源', c.source) + kv('来源明细', c.sourceNote)

    + kv('量房日期', c.measureDate) + kv('现场资料', c.siteLink)
    + kv('报告交付', c.reportDeliverDate) + kv('客户反馈', c.clientFeedback)
    + kv('方案版本', c.planVersion) + kv('方案交付', c.planDeliverDate)
    + kv('报价版本', c.quoteVersion) + kv('预算共识', c.budgetAgreed)
    + kv('定金', money(c.depositAmount) + ' · ' + (c.depositDate || ''))
    + kv('设计合同', c.designContractDate) + kv('施工合同', c.buildContractDate)
    + kv('合同金额', c.contractAmount ? money(c.contractAmount) : '')
    + '</div>'
    + '<div style="border-top:1px dashed var(--line);margin:8px 0;padding-top:8px">'
    + fileField('discountContent', '优惠内容')
    + fileField('mainMaterial', '主材选材')

    + '<div class="kv">'

    + kv('瓦工交底', c.briefMason) + kv('油工交底', c.briefPaint)

  /* 风险与归档 */
  html += '<div class="grp-t">风险与归档</div><div class="card"><div class="card-body"><div class="kv">'
    + kv('逾期', overdueDays(c) > 0 ? '逾期 ' + overdueDays(c) + ' 天' : '正常')

      else line = r.category + ' · ' + r.brand + ' ' + esc(r.spec) + '　<span class="mini">' + esc(r.status) + '</span>';

  /* 本客户提醒 */

  html += '<div class="flex gap-2 mt-4 flex-wrap">'

    + '<button class="btn" data-action="voice-quick" data-id="' + c.id + '">🎤 语音跟进</button>'
    + '<button class="btn" data-action="copy-feishu" data-id="' + c.id + '">复制飞书链接</button>'
    + escapeBtn
    + '</div>';

  /* 客户分类（每项一个单独按钮） */
  if (!c.escaped) {
    html += '<div class="grp-t">客户分类（点击即归类，并跳到该类页面）</div>';
    html += '<div class="flex gap-2 flex-wrap">';
    CLASSIFY.forEach(function (b) {
      const on = c.classified === b.k;
      html += '<button class="btn btn-sm" data-action="classify" data-id="' + c.id + '" data-bucket="' + b.k + '"'
        + (on ? ' style="background:var(--primary);color:#fff;border-color:var(--primary)"' : '') + '>'
        + (on ? '✓ ' : '') + b.label + '</button>';
    });
    if (c.classified) {
      html += '<button class="btn btn-sm" data-action="classify-clear" data-id="' + c.id + '">清除分类</button>';
    }
    html += '</div>';
    html += '<div class="mini mt-2">当前分类：' + esc(c.classified
      ? CLASSIFY_LABELS[c.classified] + '（' + (c.classified_at || '—') + '）'
      : '未分类 · 跟随自动规则') + '</div>';
  }

  html += '</div></div>';
  return html;
}

function buildTree(c) {
  const root = c.obsidianPath || ('恒彩客户库/' + c.name + '-' + c.community + '-' + c.area + '㎡');
  const subs = ['01 基础资料', '02 沟通记录', '03 量房资料', '04 方案版本', '05 报价与合同',
    '06 施工交底', '07 主材台账', '08 竣工交付', '09 售后维护'];
  return root + '\n' + subs.map(function (s, i) {
    return (i === subs.length - 1 ? '└─ ' : '├─ ') + s;
  }).join('\n');
}

function saveFollowRecord(id) {
  const c = cust(id);
  if (!c) return;
  const content = (document.getElementById('fu_content') || {}).value.trim();
  if (!content) { toast('请填写跟进内容'); return; }
  const type = (document.getElementById('fu_type') || {}).value || '电话';
  const nextDate = (document.getElementById('fu_date') || {}).value || shift(3);
  const nextAction = ((document.getElementById('fu_next') || {}).value || '').trim();
  const concerns = ((document.getElementById('fu_concerns') || {}).value || '').trim();
  DB.followUps.push({
    id: 'F' + Date.now(), customerId: id, date: TODAY,
    type: type, content: content, nextAction: nextAction || '待跟进',
    nextFollowDate: nextDate, operator: c.designer || '本人'
  });
  c.lastFollowDate = TODAY;
  c.nextFollowDate = nextDate;
  if (concerns) c.concerns = concerns;
  const syncEl = document.getElementById('fu_sync');
  if (syncEl && syncEl.checked) {
    const g = gateInfo(c.stage);
    const miss = g ? missingFields(c, g.need) : [];
    if (miss.length) {
      const fk = miss[0][0];
      c[fk] = /Date$/.test(fk) ? nextDate : content;
    }
  }
  saveDB();
  document.getElementById('modal').classList.remove('open');
  render();
  toast('已记录跟进，下次 ' + nextDate);
}

/* ---------- 19. 渲染主循环 ---------- */
function renderNav() {
  let html = '';
  NAV_GROUPS.forEach(function (g) {
    html += '<div class="nav-group"><div class="nav-group-t">' + g.name + '</div>';
    g.items.forEach(function (k) {
      const v = VIEWS[k];
      if (!v) return;
      const n = typeof v.count === 'function' ? v.count() : 0;
      html += '<button class="nav-item ' + (state.view === k ? 'active' : '') + '" data-action="nav" data-view="' + k + '">'
        + '<span class="ico">' + (NAV_ICONS[k] || '·') + '</span><span class="flex-1 truncate">' + v.title + '</span>'
        + (n ? '<span class="cnt">' + n + '</span>' : '') + '</button>';
    });
    html += '</div>';
  });
  $('#nav').innerHTML = html;
}
function render(noScroll) {
  const v = VIEWS[state.view] || VIEWS.today;
  $('#topTitle').textContent = v.title;
  $('#view').innerHTML = v.render();
  renderNav();
  const d = $('#drawer');
  if (state.drawerId) { d.innerHTML = renderDrawer(state.drawerId); d.classList.add('open'); }
  else { d.innerHTML = ''; d.classList.remove('open'); }
  if (!noScroll) window.scrollTo(0, 0);
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(function () { t.classList.remove('show'); }, 1900);
}
function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { toast('已复制'); }, function () { fallbackCopy(text); });
    } else fallbackCopy(text);
  } catch (e) { fallbackCopy(text); }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); toast('已复制'); } catch (e) { toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

/* ---------- 20. 事件 ---------- */
document.addEventListener('click', function (e) {
  if (e.target.id === 'modal') { $('#modal').classList.remove('open'); return; }
  if (e.target.id === 'drawer') { state.drawerId = null; render(); return; }
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const act = el.getAttribute('data-action');
  const id = el.getAttribute('data-id');

  if (act === 'toggle-nav') { document.body.classList.toggle('nav-open'); return; }
  if (act === 'nav') {
    state.view = el.getAttribute('data-view');
    state.drawerId = null;
    document.body.classList.remove('nav-open');
    render();
    return;
  }
  if (act === 'open-customer') { state.drawerId = id; render(); return; }
  if (act === 'close-drawer') { state.drawerId = null; render(); return; }
  if (act === 'new-customer') { $('#modal').innerHTML = renderModal(); $('#modal').classList.add('open'); return; }
  if (act === 'close-modal') { $('#modal').classList.remove('open'); return; }
  if (act === 'reset') {
    if (confirm('重置为演示数据？本地保存的修改将丢失。')) { resetDB(); render(); toast('已重置'); }
    return;
  }
  if (act === 'save-customer') { saveCustomer(); return; }

/* 图片压缩：避免 localStorage / 云端 payload 过大 */
function compressImage(dataUrl, cb) {
  const img = new Image();
  img.onload = function () {
    const maxW = 1600;
    let w = img.width, h = img.height;
    if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    try {
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      cb(canvas.toDataURL('image/jpeg', 0.82));
    } catch (e) { cb(dataUrl); }
  };
  img.onerror = function () { cb(dataUrl); };
  img.src = dataUrl;
}

/* 上传合同附件（优惠内容/主材选材/构架表/施工图纸） */
function uploadContractFile(cid, key, input) {
  const c = cust(cid);
  if (!c || !input.files || !input.files.length) { return; }
  if (!Array.isArray(c[key])) c[key] = [];
  const total = input.files.length;
  let done = 0;
  Array.from(input.files).forEach(function (file) {
    if (file.size > 8 * 1024 * 1024) {
      toast(file.name + ' 超过 8MB，已跳过');
      done++;
      if (done === total) { saveDB(); render(); }
      return;
    }
    const reader = new FileReader();
    reader.onload = function (e) {
      const dataUrl = e.target.result;
      if (file.type.indexOf('image/') === 0) {
        compressImage(dataUrl, function (compressed) {
          c[key].push({ name: file.name, dataUrl: compressed });
          done++;
          if (done === total) { saveDB(); render(); toast('已上传 ' + total + ' 个文件'); }
        });
      } else {
        c[key].push({ name: file.name, dataUrl: dataUrl });
        done++;
        if (done === total) { saveDB(); render(); toast('已上传 ' + total + ' 个文件'); }
      }
    };
    reader.onerror = function () { done++; if (done === total) { saveDB(); render(); } };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast('当前浏览器不支持语音识别，请用 Chrome 或 Edge');
    return;
  }
  // 麦克风需要 localhost 或 HTTPS；file:// 双击打开会被浏览器静默拒绝
  if (location.protocol === 'file:') {
    voiceState.recording = false;
    $('#modal').innerHTML = renderVoiceModal();
    toast('麦克风不可用：请双击 start.bat 启动本地服务后再用语音，不要直接双击 index.html');
    return;
  }
  const r = new SR();
  r.lang = 'zh-CN';
  r.continuous = true;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onresult = function (e) {
    let t = '';
    for (let i = 0; i < e.results.length; i++) {
      if (e.results[i].isFinal) t += e.results[i][0].transcript;
    }
    if (t) {
      voiceState.text = (voiceState.text || '') + t;
      const box = $('#voiceText');
      if (box) box.value = voiceState.text;
    }
  };
  r.onerror = function (e) {
    const errMap = {
      'not-allowed': '麦克风被浏览器拒绝，请在地址栏点锁图标 → 允许麦克风',
      'service-not-allowed': '语音服务不可用，请检查网络或换用 Chrome / Edge',
      'no-speech': '没检测到声音，请靠近麦克风再试',
      'audio-capture': '找不到麦克风设备',
      'network': '网络错误，语音识别需要联网',
    };
    toast('录音出错：' + (errMap[e.error] || e.error));
    voiceState.recording = false;
    $('#modal').innerHTML = renderVoiceModal();
  };
  // 自动续接：说话停顿导致识别结束时，若用户还没点停止，自动重启
  r.onend = function () {
    if (voiceState.recording && voiceState.recog === r) {
      try { r.start(); } catch (e) { voiceState.recording = false; }
    } else {
      voiceState.recording = false;
    }
  };
  voiceState.recog = r;
  voiceState.recording = true;
  // 不清空已有文字，支持多次录音追加
  r.start();
  $('#modal').innerHTML = renderVoiceModal();
  toast('正在聆听…说完点「停止录音」');
}

function stopVoice() {
  voiceState.recording = false;
  if (voiceState.recog) {
    try { voiceState.recog.stop(); } catch (e) {}
    voiceState.recog = null;
  }
  $('#modal').innerHTML = renderVoiceModal();
  parseVoiceText();
}

/* 规则解析：从语音文字中提取客户、操作类型、内容、下一步、日期 */
function parseVoiceText() {
  const text = ($('#voiceText') || {}).value || voiceState.text || '';
  if (!text.trim()) { toast('没有可解析的文字'); return; }
  voiceState.text = text;
  const p = { content: text, nextAction: '', nextDate: '' };

  // 1. 匹配客户（姓名 / 小区）
  let best = null, bestScore = 0;
  DB.customers.forEach(function (c) {
    let s = 0;
    if (text.indexOf(c.name) >= 0) s += 10;
    if (c.community && text.indexOf(c.community) >= 0) s += 5;
    if (s > bestScore) { bestScore = s; best = c; }
  });
  if (best) p.customerId = best.id;

  // 2. 操作类型（"加条跟进" 优先级最高，避免被主材/方案等关键词覆盖）
  if (/加.{0,2}跟进|跟进记录|联系了|沟通了/.test(text)) p.action = 'followup';
  else if (/流失|丢了|不做了/.test(text)) p.action = 'status';
  else if (/沉睡|唤醒|恢复正常/.test(text)) p.action = 'status';
  else if (/推进|到.{1,4}阶段|阶段/.test(text)) p.action = 'advance';
  else if (/交底/.test(text)) p.action = 'briefing';
  else if (/主材|瓷砖|地板|橱柜|木门|卫浴|下单/.test(text)) p.action = 'material';
  else if (/方案|版本|改图|图纸/.test(text)) p.action = 'version';
  else if (/变更|增项|加项/.test(text)) p.action = 'change';
  else p.action = 'followup';

  // 3. 提取日期：优先"X天后/下次跟进"，其次相对日期词
  const cnNum = { '一':1,'二':2,'两':2,'三':3,'四':4,'五':5,'六':6,'七':7,'八':8,'九':9,'十':10 };
  let dn = text.match(/(\d+)\s*天(后|之后)/);
  if (dn) {
    p.nextDate = shift(Number(dn[1]));
  } else {
    dn = text.match(/([一二两三四五六七八九十])\s*天(后|之后)/);
    if (dn) p.nextDate = shift(cnNum[dn[1]] || 3);
  }
  if (!p.nextDate) {
    const dateMap = { '今天': 0, '明天': 1, '后天': 2, '大后天': 3 };
    const dm = text.match(/(明天|后天|大后天|下周一|下周二|下周三|下周四|下周五|下周六|下周日)/);
    if (dm) {
      const k = dm[1];
      if (dateMap[k] !== undefined) p.nextDate = shift(dateMap[k]);
      else {
        const wd = { '下周一': 1, '下周二': 2, '下周三': 3, '下周四': 4, '下周五': 5, '下周六': 6, '下周日': 0 }[k];
        if (wd !== undefined) {
          const now = new Date();
          const cur = now.getDay();
          let diff = (wd - cur + 7) % 7;
          if (diff === 0) diff = 7;
          p.nextDate = fmtD(new Date(now.getTime() + diff * 86400000));
        }
      }
    }
  }
  if (!p.nextDate) p.nextDate = shift(3);

  // 4. 下一步动作（截取"下次"/"之后"/"再"后面的内容）
  const nm = text.match(/(?:下次|之后|再|回头|稍后)([^。！？；\n]{2,20})/);
  if (nm) p.nextAction = nm[1].trim();

  voiceState.parsed = p;
  $('#modal').innerHTML = renderVoiceModal();
  if (p.customerId) $('#v_customer').value = p.customerId;
  $('#v_action').value = p.action;
  toast('解析完成：' + (VOICE_ACTIONS.filter(function(a){return a.id===p.action;})[0]||{}).label);
}

function saveVoiceEntry() {
  const cid = $('#v_customer').value;
  const action = $('#v_action').value;
  const content = $('#v_content').value.trim();
  const nextAction = $('#v_next').value.trim();
  const nextDate = $('#v_nextdate').value;
  const c = cust(cid);
  if (!c) { toast('请选择客户'); return; }

  if (action === 'followup') {
    if (!content) { toast('内容不能为空'); return; }
    DB.followUps.push({
      id: 'F' + Date.now(), customerId: cid, date: TODAY,
      type: '电话', content: content, nextAction: nextAction || '待跟进',
      nextFollowDate: nextDate || shift(3), operator: '本人'
    });
    c.lastFollowDate = TODAY;
    c.nextFollowDate = nextDate || shift(3);
    toast('已添加跟进：' + c.name);
  } else if (action === 'status') {
    let st = '正常';
    if (/流失/.test(content)) st = '流失';
    else if (/沉睡/.test(content)) st = '沉睡';
    else if (/唤醒|恢复/.test(content)) st = '正常';
    c.status = st;
    if (st === '正常') { c.lastFollowDate = TODAY; c.nextFollowDate = shift(3); }
    toast(c.name + ' 状态 → ' + st);
  } else if (action === 'advance') {
    const g = gateInfo(c.stage);
    if (!g) { toast('已是最后阶段'); return; }
    const miss = missingFields(c, g.need);
    const force = /强制|跳过|硬推|直接推/.test(content);
    if (miss.length && !force) { toast('门禁未通过：缺 ' + miss.map(function(m){return m[1];}).join('、') + '。内容里加「强制」二字可跳过。'); return; }
    c.stage = g.to; c.stageEnterDate = TODAY;
    toast(c.name + (force ? '（强制）' : '') + ' 已推进到 ' + g.to);
  } else if (action === 'briefing') {
    const node = /拆除|水电|木工|瓦工|油工|竣工/.exec(content);
    DB.briefings.push({
      id: 'B' + Date.now(), customerId: cid,
      node: node ? node[0] + '交底' : '交底', date: TODAY,
      attendees: '业主 / 项目经理', confirmed: content, issues: '',
      drawingVersion: c.planVersion || '', signed: '是', voucher: ''
    });
    toast('已添加交底记录：' + c.name);
  } else if (action === 'material') {
    const cat = /瓷砖|地板|橱柜|木门|卫浴|吊顶|灯具|五金|石材/.exec(content);
    DB.materials.push({
      id: 'M' + Date.now(), customerId: cid,
      category: cat ? cat[0] : '主材', brand: '', spec: content,
      orderDate: /下单/.test(content) ? TODAY : null, arriveDate: null, status: /下单/.test(content) ? '已下单' : '待确认'
    });
    toast('已添加主材确认：' + c.name);
  } else if (action === 'version') {
    const vn = /v?(\d+)/i.exec(content);
    DB.versions.push({
      id: 'V' + Date.now(), customerId: cid,
      version: vn ? 'v' + vn[1] : 'v' + (DB.versions.filter(function(x){return x.customerId===cid;}).length + 1),
      date: TODAY, summary: content, status: '已交付', link: ''
    });
    c.planVersion = vn ? 'v' + vn[1] : c.planVersion;
    toast('已添加方案版本：' + c.name);
  } else if (action === 'change') {
    const am = /(\d+\.?\d*)\s*万|(\d+\.?\d*)\s*元/.exec(content);
    DB.changes.push({
      id: 'C' + Date.now(), customerId: cid, date: TODAY,
      content: content, amount: am ? (am[1] ? Number(am[1]) * 10000 : Number(am[2])) : 0,
      confirmed: '是', voucher: '', impactDays: 0
    });
    toast('已添加变更增项：' + c.name);
  }

  saveDB();
  $('#modal').classList.remove('open');
  state.drawerId = cid;
  render();
}

function exportJSON() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
  toast('已导出 data.json');
}

function boot() {
  const done = function () { selfTest(); render(); };

  let cached = null;
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) cached = JSON.parse(raw);
  } catch (e) { /* 私有模式可能不可用 */ }

  initSupabase(function () {
    /* A. 云端模式：以云端为准 */
    if (CLOUD_ON && HC_SB) {
      cloudPull(function (got) {
        if (got) { done(); return; }
        DB = cached || buildMock();
        saveDB();                 // 首次登录，把初始数据推到云端
        done();
      });
      return;
    }

    /* B. 本机模式：缓存 → data.json → 演示数据 */
    if (cached) { DB = cached; done(); return; }

    if (typeof fetch === 'function') {
      fetch('data.json', { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('no data.json');
          return r.json();
        })
        .then(function (j) {
          if (j && j.customers && j.customers.length) { DB = j; }
          else throw new Error('data.json 结构不符');
        })
        .catch(function () { DB = buildMock(); })
        .then(done);
    } else {
      DB = buildMock();
      done();
    }
  });
}
boot();
</script>
