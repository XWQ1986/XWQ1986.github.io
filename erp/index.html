<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>恒彩 · 客户跟进与交付系统 V1.0.0</title>
<style>
/* ============ 设计令牌 ============ */
:root{
  --bg:#f3f6f4; --card:#fff; --line:#e2e8e4; --ink:#1b2724; --muted:#6d7b76;
  --primary:#0f3d33; --primary-2:#1a5c4b; --primary-soft:#e7f2ee;
  --danger:#b9382c; --danger-soft:#fdecea; --warn:#a3701c; --warn-soft:#fff4df;
  --ok:#1c7355; --ok-soft:#e5f5ee;
  --shadow:0 1px 2px rgba(16,40,34,.06),0 8px 24px rgba(16,40,34,.05);
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary-2);text-decoration:none}

/* ============ Tailwind 风格工具类（已编译内联，离线可用） ============ */
.flex{display:flex}.grid{display:grid}.block{display:block}.hidden{display:none}
.relative{position:relative}.absolute{position:absolute}
.items-center{align-items:center}.items-start{align-items:flex-start}
.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.flex-col{flex-direction:column}.flex-1{flex:1 1 0%;min-width:0}.flex-wrap{flex-wrap:wrap}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}.gap-6{gap:24px}
.p-2{padding:8px}.p-3{padding:12px}.p-4{padding:16px}.p-5{padding:20px}
.px-3{padding-left:12px;padding-right:12px}.px-4{padding-left:16px;padding-right:16px}
.py-2{padding-top:8px;padding-bottom:8px}.py-3{padding-top:12px;padding-bottom:12px}
.py-4{padding-top:16px;padding-bottom:16px}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}.mt-6{margin-top:24px}
.mb-1{margin-bottom:4px}.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
.mb-6{margin-bottom:24px}
.w-full{width:100%}.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.text-center{text-align:center}.text-right{text-align:right}
.text-xs{font-size:12px}.text-sm{font-size:13px}.text-base{font-size:14px}
.text-lg{font-size:18px}.text-xl{font-size:22px}.text-2xl{font-size:26px}
.font-medium{font-weight:500}.font-semibold{font-weight:600}.font-bold{font-weight:700}
.rounded{border-radius:8px}.rounded-lg{border-radius:12px}.rounded-xl{border-radius:16px}
.border{border:1px solid var(--line)}.shadow{box-shadow:var(--shadow)}
.cursor-pointer{cursor:pointer}.overflow-hidden{overflow:hidden}.overflow-auto{overflow:auto}
.whitespace-pre-wrap{white-space:pre-wrap;word-break:break-word}
.text-muted{color:var(--muted)}.text-main{color:var(--ink)}
.text-danger{color:var(--danger)}.text-warn{color:var(--warn)}.text-ok{color:var(--ok)}
.text-primary{color:var(--primary-2)}.text-white{color:#fff}
.bg-card{background:var(--card)}.bg-page{background:var(--bg)}
.bg-danger-soft{background:var(--danger-soft)}.bg-warn-soft{background:var(--warn-soft)}
.bg-ok-soft{background:var(--ok-soft)}.bg-primary-soft{background:var(--primary-soft)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ============ 布局 ============ */
.app{display:block;min-height:100vh}
.sidebar{
  position:fixed;top:0;left:0;bottom:0;width:236px;z-index:40;
  background:linear-gradient(170deg,#0e3a30,#0b2f27 60%,#0a2a23);
  color:#e8f1ee;display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .22s ease;
}
body.nav-open .sidebar{transform:translateX(0)}
.brand{display:flex;gap:10px;align-items:center;padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand-logo{
  width:38px;height:38px;border-radius:10px;flex:none;display:grid;place-items:center;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);
  font-size:16px;font-weight:700;letter-spacing:1px;color:#fff;
}
.brand-name{font-size:13px;font-weight:600;line-height:1.3;color:#fff}
.brand-sub{font-size:11px;color:#9fc4b8;margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:10px 10px 16px}
.nav-group{margin-top:12px}
.nav-group-t{font-size:11px;color:#87ab9f;padding:6px 10px;letter-spacing:.5px}
.nav-item{
  display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;
  color:#cfe2db;padding:9px 10px;border-radius:9px;font-size:13px;cursor:pointer;
  text-align:left;transition:background .15s,color .15s;
}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600}
.nav-item .ico{width:18px;text-align:center;flex:none;opacity:.85;font-size:14px}
.nav-item .cnt{
  margin-left:auto;font-size:11px;color:#a9c8bd;background:rgba(255,255,255,.1);
  border-radius:20px;padding:0 7px;min-width:20px;text-align:center;line-height:18px;
}
.nav-item.active .cnt{background:rgba(255,255,255,.22);color:#fff}
.side-foot{padding:12px 16px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#9fc4b8}
.side-foot-t{font-weight:600;color:#fff;font-size:12px;margin-bottom:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#35d39a;margin-right:6px;box-shadow:0 0 0 3px rgba(53,211,154,.14)}
.main{min-height:100vh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.topbar-title{font-size:15px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-right{display:flex;align-items:center;gap:8px}
.search{
  width:150px;padding:7px 10px;border:1px solid var(--line);border-radius:9px;
  background:#fff;font-size:12px;outline:none;
}
.search:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(26,92,75,.1)}
.icon-btn{
  border:1px solid var(--line);background:#fff;border-radius:9px;width:36px;height:34px;
  display:none;place-items:center;cursor:pointer;font-size:16px;
}
.view{padding:14px;flex:1}
/* 云端同步加载态：页面加载即存在，数据到达后被 render() 覆盖，无需手动移除 */
.sync-loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:72px 20px;text-align:center}
.sync-spin{width:34px;height:34px;border-radius:50%;border:3px solid #dce8e2;border-top-color:#1a5c4b;animation:syncrot 0.9s linear infinite}
@keyframes syncrot{to{transform:rotate(360deg)}}
.sync-txt{margin-top:16px;font-size:14px;font-weight:600;color:#1a5c4b}
.sync-sub{margin-top:6px;font-size:12px;color:#8aa39a}
@media (min-width:900px){
  body.nav-open .sidebar{transform:none}
  .sidebar{transform:none;width:240px}
  .main{margin-left:240px}
  .icon-btn.mobile-only{display:none!important}
  .view{padding:20px 24px 40px;max-width:1180px}
  .search{width:220px}
}
/* 移动端底部标签栏 */
.tabbar{display:none}
@media (max-width:899px){
  html,body{overflow-x:hidden}
  .icon-btn.mobile-only{display:grid}
  .topbar{flex-wrap:wrap;gap:6px 10px;padding:8px 12px}
  .topbar-title{flex:1 1 auto}
  /* 顶部功能栏横向滚动：手机窄屏也能滑到全部按钮 */
  .topbar-right{
    width:100%;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
    margin:0 -12px;padding:2px 12px 4px;
  }
  .topbar-right::-webkit-scrollbar{display:none}
  .topbar-right > *{flex:0 0 auto}
  .topbar-right .search{width:120px}
  .topbar-right .btn-primary{padding:7px 10px;font-size:12px}
  .view{padding:14px 12px 90px}
  .app{padding-bottom:0}

  /* 客户行改为卡片式，触控更友好 */
  .row{padding:12px 14px;flex-wrap:wrap;gap:8px}
  .row-t{font-size:14px;white-space:normal;line-height:1.4}
  .row-s{font-size:12px;white-space:normal}
  .row-right{width:100%;flex-direction:row;align-items:center;justify-content:flex-start;text-align:left;flex-wrap:wrap;gap:6px}
  .btn-sm{padding:7px 12px;font-size:12.5px}

  /* 底部标签栏 */
  .tabbar{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:900;
    background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -4px 16px rgba(0,0,0,.05);
  }
  .tabbar button{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:none;border:0;padding:4px 0;font-size:10.5px;color:#8a9490;cursor:pointer;
  }
  .tabbar button .tb-ico{font-size:17px;line-height:1}
  .tabbar button.active{color:var(--primary);font-weight:600}
  .drawer{width:100%}
}

/* 上传进度浮条 */
.uploadbar{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(16px);
  z-index:1200;background:#1f2d2a;color:#fff;border-radius:11px;padding:11px 15px;
  min-width:250px;max-width:86vw;opacity:0;pointer-events:none;transition:all .22s;
  box-shadow:0 10px 28px rgba(0,0,0,.22);font-size:12.5px;
}
.uploadbar.show{opacity:1;transform:translateX(-50%) translateY(0)}
.uploadbar .ub-row{display:flex;align-items:center;gap:8px}
.uploadbar .ub-track{height:5px;background:rgba(255,255,255,.22);border-radius:3px;margin-top:8px;overflow:hidden}
.uploadbar .ub-fill{height:100%;width:0;background:#4ade80;transition:width .25s}
@media (max-width:899px){ .uploadbar{bottom:76px} }

/* ============ 组件 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card-title{font-size:14px;font-weight:600}
.card-sub{font-size:12px;color:var(--muted)}
.card-body{padding:14px 16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:9px;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:13px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .06s;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn:hover{background:#f7faf9}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-2)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.25);color:#dfeee9}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-sm{padding:6px 10px;font-size:12px;border-radius:8px}
.badge{
  display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:20px;
  font-size:11px;line-height:19px;white-space:nowrap;
}
.badge-primary{background:var(--primary-soft);color:var(--primary-2)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-warn{background:var(--warn-soft);color:var(--warn)}
.badge-ok{background:var(--ok-soft);color:var(--ok)}
.badge-grey{background:#eef1f0;color:#5d6b66}
.stat{padding:14px 16px;border-radius:var(--r);background:#fff;border:1px solid var(--line)}
.stat .lab{font-size:12px;color:var(--muted)}
.stat .num{font-size:24px;font-weight:700;line-height:1.25;margin-top:2px}
.stat .sub{font-size:11px;color:var(--muted);margin-top:2px}
.stat.hot{background:linear-gradient(160deg,#0f3d33,#1a5c4b);border-color:transparent;color:#fff}
.stat.hot .lab,.stat.hot .sub{color:#a9cbbf}
.stat.danger .num{color:var(--danger)}
.stat.warn .num{color:var(--warn)}
.row{
  display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);
  cursor:pointer;transition:background .13s;
}
.row:last-child{border-bottom:0}
.row:hover{background:#f8fbfa}
.row-main{flex:1;min-width:0}
.row-t{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-created{font-size:10.5px;color:#b0b0b0;margin-bottom:1px;letter-spacing:.3px}
.row-s{font-size:11.5px;color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 列表卡片：最新一条跟进预览 */
.row-latest{
  margin-top:6px;font-size:12px;color:#3c4b46;line-height:1.55;
  background:#f6faf8;border-left:2px solid #cfe3da;border-radius:0 6px 6px 0;
  padding:4px 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;word-break:break-word;
}
.row-latest b{color:var(--primary-2);font-weight:600}
.row-latest .d{color:var(--muted);font-size:10.5px;margin-left:5px;font-weight:400}
.row-latest.empty{color:#a9bab2;border-left-color:#e2e8e4;background:#fafbfa;font-size:11.5px}
.row-right{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.empty{padding:44px 16px;text-align:center;color:var(--muted);font-size:13px}
.section-t{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;font-weight:600}
.grid-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid-stats4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.grid-stats{grid-template-columns:repeat(4,1fr)}.grid-stats4{grid-template-columns:repeat(4,1fr)}}
.stagebar{display:flex;gap:4px;flex-wrap:wrap}
.stagechip{
  flex:1;min-width:56px;text-align:center;padding:7px 6px;border-radius:8px;
  background:#f1f5f3;border:1px solid var(--line);font-size:11px;
  cursor:pointer;transition:.15s;
}
.stagechip:hover{background:#e3ede9;border-color:var(--primary-2)}
.stagechip b{display:block;font-size:13px;color:var(--primary-2)}
.stagechip.cur{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 3px rgba(26,92,75,.15);transform:translateY(-1px)}
.stagechip.cur b{color:#fff}
.stagechip.done{background:#e7f1ec;border-color:#b8d5c7;color:#1a5c4b}
.stagechip.done b{color:#1a5c4b}
.stagechip.todo{opacity:.45;background:#f7f9f8}

/* 提醒卡 */
.morning{
  border-radius:var(--r);border:1px solid #f1dcb8;
  background:linear-gradient(160deg,#fff9ef,#fff3e2);padding:14px 16px;
}
.morning-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.clock{
  background:#fff;border:1px solid #f0d9b4;border-radius:9px;padding:3px 10px;
  font-size:16px;font-weight:700;color:#8a5a10;font-variant-numeric:tabular-nums;
}
.morning-item{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed #f0e0c4;font-size:12.5px}
.morning-item:last-child{border-bottom:0}
.morning-item .t{flex:none;color:#8a5a10;font-weight:600;font-size:11.5px;min-width:42px}
.morning-item .d{flex:1;min-width:0;color:#4a3a22}

/* 抽屉 */
.drawer{
  position:fixed;inset:0;z-index:60;display:none;
  background:rgba(10,24,20,.36);
}
.drawer.open{display:block}
.drawer-panel{
  position:absolute;right:0;top:0;bottom:0;width:100%;max-width:520px;
  background:#fff;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12);
}
@media (min-width:700px){.drawer-panel{border-radius:16px 0 0 16px}}
.drawer-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer-body{flex:1;overflow:auto;padding:14px 16px 40px}
@media (max-width:899px){
  .drawer-panel{bottom:60px}  /* 避让底部 tabbar ~50px */
  .drawer-body{padding-bottom:80px}
}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{min-width:0;word-break:break-word}
.grp-t{font-size:12px;font-weight:600;color:var(--primary-2);margin:16px 0 8px;padding-left:8px;border-left:3px solid var(--primary-2)}
.sub-card{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fbfdfc}
/* 日历清单 */
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal-title{font-size:15px;font-weight:600;color:var(--primary)}
.cal-nav{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:28px;cursor:pointer;color:var(--primary-2)}
.cal-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.cal-week span{text-align:center;font-size:11px;color:var(--muted);padding:2px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-day{
  position:relative;min-height:46px;border:1px solid var(--line);border-radius:8px;
  background:#fff;cursor:pointer;padding:4px 3px;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;font-size:12px;color:var(--text);
}
.cal-day .d{font-weight:600;line-height:1.2}
.cal-day .m{display:flex;gap:2px;margin-top:3px;font-size:9px;line-height:1}
.cal-day .m i{width:5px;height:5px;border-radius:50%;background:var(--primary-2);display:inline-block}
.cal-day .m i.todo{background:#e0a13c}
.cal-day.dim{opacity:.35}
.cal-day.today{border-color:var(--primary-2);box-shadow:0 0 0 2px rgba(26,92,75,.12)}
.cal-day.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.cal-day.sel .m i{background:rgba(255,255,255,.85)}
.cal-day.sel .m i.todo{background:#ffd08a}
.cal-sum{background:#f6faf8;border:1px solid #d9e7e1;border-radius:10px;padding:12px 14px;margin-bottom:10px}
.cal-sum .t{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:6px}
.cal-sum .p{font-size:12.5px;line-height:1.75;color:var(--text)}
.cal-item{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;margin-bottom:6px}
.cal-item .tt{font-size:11px;color:var(--muted);flex:0 0 44px}
.cal-item .cc{font-size:12.5px;flex:1;min-width:0;word-break:break-word}
.cal-badge{display:inline-block;font-size:10px;padding:0 6px;border-radius:8px;background:var(--soft);color:var(--primary-2);margin-left:4px}
.cal-badge.todo{background:#fdf3e2;color:#a8761f}
.cal-actions{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.ai-cfg{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:#fbfdfc}
.ai-cfg summary{cursor:pointer;padding:9px 12px;font-size:12.5px;color:var(--primary-2);font-weight:600}
.ai-cfg .bd{padding:0 12px 12px;border-top:1px dashed var(--line)}
.ai-cfg .fm{margin-top:9px}
.ai-cfg .fm label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:3px}
.ai-cfg input{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:7px;font-size:12.5px}
.ai-cfg .tip{font-size:11px;color:var(--muted);line-height:1.7;margin-top:9px}
.modal{position:fixed;inset:0;z-index:70;display:none;background:rgba(10,24,20,.4);padding:16px;overflow:auto}
.modal.open{display:block}
.modal-panel{max-width:560px;margin:24px auto;background:#fff;border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
/* 灯箱（图片放大查看 + 视频播放） */
.lightbox{position:fixed;inset:0;z-index:95;display:none;background:rgba(0,0,0,.92);align-items:center;justify-content:center;flex-direction:column;user-select:none}
.lightbox.open{display:flex}
.lb-stage{position:relative;max-width:92vw;max-height:82vh;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:92vw;max-height:82vh;object-fit:contain;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5);cursor:zoom-in;background:#111}
.lb-stage img.zoomed{max-width:none;max-height:none;cursor:zoom-out}
.lb-stage video{max-width:92vw;max-height:82vh;border-radius:6px;background:#000;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.lb-close{position:absolute;top:18px;right:22px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.lb-close:hover{background:rgba(255,255,255,.25)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:none;font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;z-index:2}
.lb-nav:hover{background:rgba(255,255,255,.28)}
.lb-nav.prev{left:22px}
.lb-nav.next{right:22px}
.lb-nav[disabled]{opacity:.25;cursor:not-allowed}
.lb-meta{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:rgba(255,255,255,.85);font-size:13px;pointer-events:none}
.lb-meta .lb-name{font-weight:600;margin-bottom:4px;word-break:break-all;padding:0 60px}
.lb-meta .lb-sub{font-size:12px;color:rgba(255,255,255,.6)}
.lb-counter{position:absolute;top:24px;left:24px;color:rgba(255,255,255,.85);font-size:13px;background:rgba(255,255,255,.1);padding:5px 12px;border-radius:14px}
.lb-loading{position:absolute;color:rgba(255,255,255,.7);font-size:14px}
.lb-att-thumb{cursor:zoom-in;transition:transform .15s,box-shadow .15s}
.lb-att-thumb:hover{transform:scale(1.06);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.lb-video-thumb{cursor:pointer;transition:transform .15s,box-shadow .15s}
.lb-video-thumb:hover{transform:scale(1.06);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.input,.select,.textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:#fff;font-size:13px;outline:none;
}
.input:focus,.select:focus,.textarea:focus{border-color:var(--primary-2);box-shadow:0 0 0 3px rgba(26,92,75,.1)}
.input::placeholder,.textarea::placeholder{color:#a9bab2;opacity:1}
.textarea{min-height:120px;resize:vertical;line-height:1.6}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:90;
  background:#123a31;color:#fff;padding:9px 16px;border-radius:22px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.2);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{
  padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:#fff;
  font-size:12.5px;cursor:pointer;
}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.fp-row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.fp-label{font-size:12px;color:var(--muted);width:36px;flex-shrink:0}
.fp-chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.fp-chips .chip{padding:4px 10px;border-radius:14px;border:1px solid #cfdcd6;background:#fff;font-size:12px;cursor:pointer;color:var(--text)}
.fp-chips .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:6px;border:1px solid var(--line);background:#fff;cursor:pointer}
.out{
  background:#0f2721;color:#d8efe7;border-radius:10px;padding:12px;font-size:12.5px;
  white-space:pre-wrap;word-break:break-word;max-height:340px;overflow:auto;line-height:1.7;
}
.pathbox{
  background:#f5f8f7;border:1px dashed #cfdcd6;border-radius:9px;padding:10px;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;white-space:pre-wrap;
  color:#3c4d47;line-height:1.7;
}
.crumb{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.hr{height:1px;background:var(--line);margin:14px 0}
.copy-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mini{font-size:11px;color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>

<script>
/* ---------- 0. 登录门禁 ----------
 * 未登录直接跳 login.html（线上 http/https 生效；本地 file:// 自用不拦）
 * 登录态存在 hc_session；云端模式再由 Supabase 校验会话有效性。
 */
(function () {
  try {
    var isHttp = /^http/.test(location.protocol);
    if (!isHttp) return;
    var raw = localStorage.getItem('hc_session');
    var s = raw ? JSON.parse(raw) : null;
    if (!s || !s.u) { location.replace('login.html'); }
  } catch (e) { /* 存储不可用时放行，避免白屏 */ }
})();
</script>
<script>

const TODAY_D = new Date();
TODAY_D.setHours(0, 0, 0, 0);
const TODAY = fmtD(TODAY_D);

function fmtD(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + dd;
}
function shift(n, base) {
  const d = new Date(base || TODAY_D);
  d.setDate(d.getDate() + n);
  return fmtD(d);
}
function diffDays(a, b) { // a - b，正数表示 a 在 b 之后
  if (!a || !b) return null;
  return Math.round((new Date(a + 'T00:00:00') - new Date(b + 'T00:00:00')) / 86400000);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[m]));
}
function money(n) {
  if (n == null || n === '') return '—';
  if (n >= 10000) return (n / 10000).toFixed(n % 10000 === 0 ? 0 : 1) + ' 万';
  return n.toLocaleString('zh-CN');
}
function sum(arr, key) {
  return arr.reduce((a, b) => a + (Number(b[key]) || 0), 0);
}

function cloudPush() {
  if (!HC_SB) return;
  HC_SB.auth.getUser().then(function (r) {
    const u = r && r.data ? r.data.user : null;
    if (!u) return;
    const target = ACTIVE_TENANT || u.id;
    HC_SB.from('hc_data').select('updated_at').eq('user_id', target).maybeSingle()
      .then(function (q) {
        const remote = q && q.data ? q.data.updated_at : null;
        /* 统一按毫秒比较，避免 +00:00 与 Z 两种写法造成误判 */
        const same = cloudStamp && remote && new Date(remote).getTime() === new Date(cloudStamp).getTime();
        if (cloudStamp && remote && !same) {
          const when = String(remote).replace('T', ' ').slice(0, 19);
          const go = confirm('检测到云端数据已于 ' + when + ' 被其他设备修改。\n\n点「确定」用本机数据覆盖；\n点「取消」放弃本次保存（建议刷新页面取最新数据）。');
          if (!go) { toast('已取消保存，请刷新页面'); return; }
        }
        doCloudPush(target);
      })
      .catch(function () { doCloudPush(target); });
  });
}
function doCloudPush(target) {
  const stamp = new Date().toISOString();
  cloudStamp = stamp;   // 先占位，避免自身连续保存误判冲突
  HC_SB.from('hc_data').upsert({
    user_id: target,
    payload: DB,
    updated_at: stamp
  }).then(function (res) {
    if (res && res.error) {
      console.warn('[云同步] 写入失败：', res.error.message);

    }
  });
}

/* ---------- 6.1 沉睡自动判定（Q9） ----------
 * 阈值集中在这里，改一处即全局生效，同步改 01_飞书配置说明书 的公式常量。
 * 逻辑：距「上次跟进日」的天数（无则回退到建档日）
 *   ≥60 天 → 沉睡候选
 *   ≥30 天 且 非期房 → 沉默预警（期房客户等交房周期长，不参与预警，避免天天报警）
 */
const SLEEP_WARN_DAYS = 30;
const SLEEP_DAYS = 60;

function lastTouch(c) { return c.lastFollowDate || c.createdDate || null; }
function silenceDays(c) {
  const d = lastTouch(c);
  if (!d) return 0;
  const n = diffDays(TODAY, d);
  return n > 0 ? n : 0;
}
function isSleepCandidate(c) {
  if (c.status === '沉睡' || c.status === '流失' || c.status === '竣工归档') return false;
  if (c.stage === 'S10') return false;
  return silenceDays(c) >= SLEEP_DAYS;
}
/* 返回 normal / warn / sleep */
function sleepLevel(c) {
  if (c.status === '沉睡') return 'sleep';
  if (c.status === '流失' || c.status === '竣工归档') return 'normal';
  if (c.stage === 'S10') return 'normal';
  if (isSleepCandidate(c)) return 'sleep';
  if (c.houseStatus !== '期房' && silenceDays(c) >= SLEEP_WARN_DAYS) return 'warn';
  return 'normal';
}
function sleepBadge(c) {
  const lv = sleepLevel(c);
  if (lv === 'sleep') return '<span class="badge badge-grey">☾ 沉睡</span>';
  if (lv === 'warn') return '<span class="badge badge-warn">沉默 ' + silenceDays(c) + ' 天</span>';
  return '';
}
function sleepingPool() {
  return DB.customers.filter(function (c) {
    return c.status === '沉睡' || isSleepCandidate(c);
  });
}
function stageBadge(c) {
  const cls = c.stage === 'S10' ? 'badge-ok' : (STAGE_IDX[c.stage] >= 6 ? 'badge-primary' : 'badge-grey');
  return '<span class="badge ' + cls + '">' + c.stage + ' ' + STAGE_MAP[c.stage] + '</span>';
}

}

/* ---------- 7. 排序引擎（修复原图「下次跟进日期」排序 bug） ---------- */
/**
 * 规则：
 * 1) 空日期置底
 * 2) 逾期置顶（组内仍升序）
 * 3) 日期升序（ISO 字符串比较，杜绝 8.24/8.14 混用）
 * 4) 同日期 → 阶段序号升序 → 建档日升序（稳定）
 */
function sortCustomers(list, today) {
  const t = today || TODAY;
  return list.slice().sort(function (a, b) {
    const ad = a.nextFollowDate, bd = b.nextFollowDate;
    if (!ad && !bd) return tieBreak(a, b);
    if (!ad) return 1;
    if (!bd) return -1;
    const ao = ad < t, bo = bd < t;
    if (ao !== bo) return ao ? -1 : 1;
    if (ad < bd) return -1;
    if (ad > bd) return 1;
    return tieBreak(a, b);
  });
}
function tieBreak(a, b) {
  const ai = STAGE_IDX[a.stage] || 0, bi = STAGE_IDX[b.stage] || 0;
  if (ai !== bi) return ai - bi;
  const ac = a.createdDate || '', bc = b.createdDate || '';
  return ac < bc ? -1 : (ac > bc ? 1 : 0);
}

    if (c.status === '流失' || c.status === '沉睡') return; // 沉睡客户由季度唤醒统一处理
    EVENT_RULES.forEach(function (r) {

      return String(b.id || '').localeCompare(String(a.id || ''));

/* ---------- 12. 任务总览 ---------- */
function renderTasks() {
  const items = [];
  ruleItems().forEach(function (it) {
    const st = dueState(it.due);
    if (state.taskFilter === 'today' && st.k !== 'today') return;
    if (state.taskFilter === 'over' && st.k !== 'over') return;
    if (state.taskFilter === 'week' && !(st.k === 'today' || st.k === 'over' || st.k === 'soon')) return;
    items.push({
      id: it.code + '_' + it.cid, kind: '节点', title: it.title, sub: it.rule + ' · ' + it.detail,
      due: it.due, st: st, cid: it.cid
    });
  });
  DB.customers.filter(isOverdue).forEach(function (c) {
    const st = dueState(c.nextFollowDate);
    if (state.taskFilter === 'today') return;
    if (state.taskFilter === 'week' && st.k === 'later') return;
    items.push({
      id: 'FU_' + c.id, kind: '跟进', title: '跟进逾期 · ' + c.name + '（' + c.community + '）',
      sub: '下次跟进日 ' + c.nextFollowDate + '，已逾期 ' + overdueDays(c) + ' 天', due: c.nextFollowDate, st: st, cid: c.id
    });
  });
  items.sort(function (a, b) { return a.due < b.due ? -1 : (a.due > b.due ? 1 : 0); });

  const chips = [['all', '全部'], ['today', '今日'], ['over', '逾期'], ['week', '未来 7 天']];
  let html = '<div class="tabs">';
  chips.forEach(function (x) {

  dispute: ['不同意', '争议', '分歧', '吵', '意见不合', '坚持', '反对', '不肯'],
  todo: ['明天', '下周', '约', '安排', '确认', '发我', '给到', '对接', '进场', '下单', '什么时候', '几点'],
  concern: ['担心', '怕', '贵', '超预算', '预算', '犹豫', '再考虑', '比较', '对比', '别家', '后悔', '售后', '不放心', '坑']
};
function distill(text) {
  const sentences = String(text || '')
    .split(/[。！？!?；;\n\r]/)
    .map(function (s) { return s.trim(); })
    .filter(function (s) { return s.length > 1; });
  const buckets = { need: [], revise: [], dispute: [], todo: [], concern: [] };
  sentences.forEach(function (s) {
    Object.keys(AI_RULES).forEach(function (k) {
      if (AI_RULES[k].some(function (w) { return s.indexOf(w) >= 0; })) buckets[k].push(s);
    });
  });
  return { sentences: sentences.length, buckets: buckets };
}

/* ===== AI 经营中心 · 日历清单 ===== */
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function calDateStr(y, m, d) { return y + '-' + pad2(m) + '-' + pad2(d); }
function calFollowsOn(ds) {
  return DB.followUps.filter(function (r) { return (r.date || '') === ds; })
    .slice().sort(function (a, b) { return fuTs(b) - fuTs(a); });
}
function calTodosOn(ds) {
  return DB.customers.filter(function (c) { return c.nextFollowDate === ds && !c.escaped && !c.lost; });
}
function daySummaryText(ds, fs, td) {
  if (!fs.length && !td.length) return '当日暂无跟进记录，也没有待办提醒。';
  let s = '';
  if (fs.length) {
    const nm = {};
    fs.forEach(function (r) {
      const c = cust(r.customerId);
      const k = c ? c.name : '未关联客户';
      nm[k] = (nm[k] || 0) + 1;
    });
    const names = Object.keys(nm);
    s += '当日记录 ' + fs.length + ' 条跟进，覆盖 ' + names.length + ' 位客户（'
      + names.slice(0, 6).join('、') + (names.length > 6 ? ' 等' : '') + '）。';
    const types = {};
    fs.forEach(function (r) { types[r.type || '跟进'] = 1; });
    s += '沟通方式：' + Object.keys(types).join('、') + '。';
  } else {
    s += '当日尚无跟进记录。';
  }
  if (td.length) {
    s += ' 当天待办 ' + td.length + ' 项：' + td.slice(0, 5).map(function (c) { return c.name; }).join('、')
      + (td.length > 5 ? ' 等' : '') + '。';
  }
  return s;
}

function renderCalendar() {
  const ps = String(state.calMonth || TODAY.slice(0, 7)).split('-');
  const y = Number(ps[0]), m = Number(ps[1]);
  const startDow = new Date(y, m - 1, 1).getDay();
  const daysInMonth = new Date(y, m, 0).getDate();
  const prefix = y + '-' + pad2(m);

  const fuMap = {}, todoMap = {};
  DB.followUps.forEach(function (r) {
    const d = r.date || '';
    if (d.indexOf(prefix) === 0) fuMap[d] = (fuMap[d] || 0) + 1;
  });
  DB.customers.forEach(function (c) {
    const d = c.nextFollowDate || '';
    if (!c.escaped && !c.lost && d.indexOf(prefix) === 0) todoMap[d] = (todoMap[d] || 0) + 1;
  });

  let grid = '';
  for (let i = 0; i < startDow; i++) grid += '<div></div>';
  for (let d = 1; d <= daysInMonth; d++) {
    const ds = calDateStr(y, m, d);
    const cls = 'cal-day'
      + (ds === TODAY ? ' today' : '')
      + (ds === state.calDay ? ' sel' : '');
    const marks = (fuMap[ds] ? '<i></i>' : '') + (todoMap[ds] ? '<i class="todo"></i>' : '');
    grid += '<div class="' + cls + '" data-action="cal-day" data-val="' + ds + '">'
      + '<div class="d">' + d + '</div><div class="m">' + marks + '</div></div>';
  }

  const ds = state.calDay;
  const fs = calFollowsOn(ds);
  const td = calTodosOn(ds);

  let html = '<div class="card mb-4"><div class="card-body">'
    + '<div class="cal-head">'
    + '<button class="cal-nav" data-action="cal-prev">‹</button>'
    + '<div class="cal-title">' + y + ' 年 ' + m + ' 月</div>'
    + '<button class="cal-nav" data-action="cal-next">›</button>'
    + '<button class="btn btn-xs" data-action="cal-today" style="margin-left:auto">回到今天</button>'
    + '</div>'
    + '<div class="cal-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>'
    + '<div class="cal-grid">' + grid + '</div>'
    + '<div class="mini text-muted mt-3"><i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--primary-2);margin-right:4px"></i>跟进记录　'
    + '<i style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#e0a13c;margin:0 4px 0 12px"></i>待办提醒</div>'
    + '</div></div>';

  /* 当日工作总结 */
  html += '<div class="cal-actions">'
    + '<button class="btn btn-xs" data-action="cal-copy">📋 复制小结</button>'
    + '<button class="btn btn-xs" data-action="cal-export-day">⬇ 导出当日</button>'
    + '<button class="btn btn-xs" data-action="cal-export-week">⬇ 导出本周</button>'
    + '</div>';
  html += '<div class="cal-sum"><div class="t">📄 ' + esc(ds) + ' 工作总结</div>'
    + '<div class="p">' + esc(daySummaryText(ds, fs, td)) + '</div></div>';

  /* 当日跟进明细 */
  html += '<div class="grp-t">当日跟进（' + fs.length + '）</div>';
  if (!fs.length) {
    html += '<div class="sub-card mini text-muted">当日无跟进记录</div>';
  } else {
    fs.forEach(function (r) {
      const c = cust(r.customerId);
      html += '<div class="cal-item"><div class="tt">' + esc(r.type || '跟进') + '</div>'
        + '<div class="cc"><b>' + esc(c ? c.name : '未关联') + '</b>'
        + '<div class="mini" style="margin-top:2px">' + esc(String(r.content || '').slice(0, 90)) + '</div></div></div>';
    });
  }

  /* 当日待办 */
  html += '<div class="grp-t">当日待办（' + td.length + '）</div>';
  if (!td.length) {
    html += '<div class="sub-card mini text-muted">当日无需跟进客户</div>';
  } else {
    td.forEach(function (c) {
      html += '<div class="cal-item"><div class="tt"><span class="cal-badge todo">待跟进</span></div>'
        + '<div class="cc"><b>' + esc(c.name) + '</b> · ' + esc(c.community) + ' · ' + c.area + '㎡'
        + '<div class="mini" style="margin-top:2px">阶段 ' + esc(c.stage) + ' · '
        + esc(c.intent || '') + '</div></div>'
        + '<button class="btn btn-xs" data-action="open-customer" data-id="' + c.id + '">查看</button></div>';
    });
  }

  /* 未来 7 天计划 */
  const base = new Date(ds.replace(/-/g, '/'));
  let wp = '';
  for (let i = 0; i < 7; i++) {
    const dt = new Date(base.getTime() + i * 86400000);
    const wds = calDateStr(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
    const list = calTodosOn(wds);
    if (!list.length) continue;
    wp += '<div class="cal-item"><div class="tt">' + wds.slice(5) + '</div>'
      + '<div class="cc">' + list.map(function (c) { return esc(c.name); }).join('、')
      + '<div class="mini" style="margin-top:2px">共 ' + list.length + ' 位客户待跟进</div></div></div>';
  }
  html += '<div class="grp-t">未来 7 天计划</div>';
  html += wp || '<div class="sub-card mini text-muted">未来 7 天暂无排期</div>';

  html += renderAiSettings();

  return html;
}

async function doubaoPolish(raw) {
  const c = aiCfg();
  if (!c.key) throw new Error('未配置 API Key');
  const sys = '你是室内设计公司的客户跟进助理。请把设计师口述的语音转写文本整理成规范、书面的中文跟进记录。'

    + '4) 输出 1-4 句连贯短句，用中文标点分隔；5) 不加编号、不加解释、不改变原意；6) 只输出整理后的正文。';
  const resp = await fetch(c.base.replace(/\/$/, '') + '/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
    body: JSON.stringify({
      model: c.model,
      messages: [{ role: 'system', content: sys }, { role: 'user', content: String(raw) }],
      temperature: 0.2,
      max_tokens: 600
    })
  });
  if (!resp.ok) {
    let t = '';
    try { t = (await resp.text()).slice(0, 120); } catch (e) { }
    throw new Error('接口 ' + resp.status + (t ? '：' + t : ''));
  }
  const j = await resp.json();
  const msg = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!msg) throw new Error('返回内容为空');
  return String(msg).trim().replace(/^["'“”‘’]+|["'“”‘’]+$/g, '');
}

function buildWeekReport(ds) {
  const base = new Date(ds.replace(/-/g, '/'));

  }

    });

  });
  s += '────────────────────\n恒彩设计部客户管理中心\n';
  return s;
}

  return need.filter(function (n) {
    const v = c[n[0]];
    return v == null || v === '' || v === 0;
  });
}
/* 分阶段资料表单：不同阶段渲染不同填写项 / 上传项 */
function renderStageForms(c, attBlock) {
  let out = '';
  STAGE_FORMS.forEach(function (cfg) {
    const open = c.stage === cfg.stage ? ' open' : '';
    out += '<details' + open + ' style="margin-bottom:6px">'
      + '<summary style="cursor:pointer;font-weight:600;font-size:13px;padding:5px 0">'
      + cfg.stage + ' ' + esc(cfg.name) + '</summary>';
    (cfg.texts || []).forEach(function (t) {
      out += '<div class="field" style="margin-top:6px"><label>' + esc(t.label) + '</label>'
        + '<textarea class="textarea" rows="3" placeholder="' + esc(t.ph || '') + '"'
        + ' onchange="setStageText(\'' + c.id + '\',\'' + t.k + '\',this)">' + esc(c[t.k] || '') + '</textarea></div>';
    });
    (cfg.files || []).forEach(function (f) {
      out += '<div style="margin-top:6px">' + attBlock(cfg.stage, f.c, f.label) + '</div>';
    });
    out += '</details>';
  });

  /* 施工 7 个节点：计划起止时间 + 现场图片 */
  const nodeOpen = (c.stage === 'S9' || c.stage === 'S8') ? ' open' : '';
  out += '<details' + nodeOpen + ' style="margin-bottom:4px">'
    + '<summary style="cursor:pointer;font-weight:600;font-size:13px;padding:5px 0">施工节点资料（7 个节点）</summary>';
  CONSTRUCTION_NODES.forEach(function (n) {
    const nd = (c.nodes && c.nodes[n.key]) || {};
    out += '<div style="border-top:1px dashed var(--line);padding:8px 0">'
      + '<div class="text-sm font-semibold" style="margin-bottom:4px">' + n.key + ' ' + esc(n.name) + '</div>'
      + '<div class="flex gap-2 mb-2" style="flex-wrap:wrap">'
      + '<div style="flex:1;min-width:128px"><div class="mini text-muted">计划开始</div>'
      + '<input class="input" type="date" style="padding:4px 6px;font-size:12px" value="' + esc(nd.planStart || '') + '"'
      + ' onchange="setNodeDate(\'' + c.id + '\',\'' + n.key + '\',\'planStart\',this)"></div>'
      + '<div style="flex:1;min-width:128px"><div class="mini text-muted">计划结束</div>'
      + '<input class="input" type="date" style="padding:4px 6px;font-size:12px" value="' + esc(nd.planEnd || '') + '"'
      + ' onchange="setNodeDate(\'' + c.id + '\',\'' + n.key + '\',\'planEnd\',this)"></div>'
      + '</div>'
      + attBlock(n.key, 'nodePhoto', '现场图片')
      + '</div>';
  });
  out += '</details>';
  return out;
}
function setStageText(cid, key, el) {
  const c = cust(cid);
  if (!c) return;
  c[key] = el.value;
  saveDB();
  auditWrite(cid, 'stage_text_update', { field: key, value: el.value });
}
function setNodeDate(cid, nodeKey, field, el) {
  const c = cust(cid);
  if (!c) return;
  if (!c.nodes) c.nodes = {};
  if (!c.nodes[nodeKey]) c.nodes[nodeKey] = {};
  c.nodes[nodeKey][field] = el.value;
  saveDB();
  auditWrite(cid, 'node_date_update', { node: nodeKey, field: field, value: el.value });
}

function renderDrawer(id) {
  const c = cust(id);
  if (!c) return '';
  const g = gateInfo(c.stage);
  const miss = g ? missingFields(c, g.need) : [];
  const nextStage = g ? g.to : null;

  const kv = function (k, v, hint) {
    return '<div class="k">' + esc(k) + '</div><div class="v">' + (v == null || v === '' ? '<span class="text-muted">待补</span>' : esc(v)) + (hint ? ' <span class="mini">' + esc(hint) + '</span>' : '') + '</div>';
  };

  /* 单个上传项（元数据在 attachments 表，文件在 Storage，私有桶走签名链接） */
  const attBlock = function (stageCode, cat, label) {
    const rows = attOf(c.id, stageCode, cat);
    let items = '';
    rows.forEach(function (a) {
      const img = isImageName(a.file_name, a.mime);
      const vid = isVideoName(a.file_name, a.mime);
      const isCad = /\.(dwg|dxf)$/i.test(a.file_name || '');
      let thumb;
      if (img) {
        thumb = '<img class="lb-att-thumb" data-att-path="' + esc(a.path) + '" alt="" loading="lazy" decoding="async"'
          + ' style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex-shrink:0;background:#f1f5f3"'
          + ' onclick="openLightbox(\'' + a.id + '\')" title="点击放大">';
      } else if (vid) {
        thumb = '<div class="lb-video-thumb" onclick="openVideoPlayer(\'' + a.id + '\')" title="点击播放"'
          + ' style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#1a5c4b;color:#fff;border-radius:6px;font-size:18px;flex-shrink:0">▶</div>';
      } else {
        thumb = '<div style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:#f1f5f3;border-radius:6px;font-size:15px;flex-shrink:0">' + (isCad ? '🗂' : '📄') + '</div>';
      }
      items += '<div class="flex items-center gap-2 mb-1">' + thumb
        + '<div class="flex-1 mini truncate">' + esc(a.file_name || '未命名')
        + '<span class="text-muted"> · ' + fmtSize(a.size) + '</span></div>'
        + '<button class="btn btn-sm" onclick="openAttachment(\'' + a.id + '\')">下载</button>'
        + '<button class="btn btn-sm" style="color:#d64545;border-color:#e8c4c4" onclick="removeAttachment(\'' + a.id + '\')">删除</button>'
        + '</div>';
    });
    return '<div style="margin-bottom:10px">'
      + '<div class="flex items-center gap-2" style="margin-bottom:3px">'
      + '<span class="text-sm font-semibold">' + esc(label) + '</span>'
      + '<span class="mini text-muted">' + rows.length + ' 个</span></div>'
      + items
      + '<label class="btn btn-sm" style="margin-top:2px;cursor:pointer">📎 上传文件/图片/视频'
      + '<input type="file" multiple accept="' + ACCEPT_FILES + '" style="display:none"'
      + ' onchange="uploadAttachments(\'' + c.id + '\',\'' + stageCode + '\',\'' + cat + '\',this)">'
      + '</label></div>';
  };

  let html = '<div class="drawer-panel">'
    + '<div class="drawer-head">'
    + '<div class="flex-1"><div class="flex gap-2 items-center flex-wrap"><span class="text-lg font-semibold">' + esc(c.name) + '</span>'
    + stageBadge(c) + intentBadge(c.intent) + '</div>'
    + '<div class="mini mt-1">' + c.id + ' · ' + esc(c.community) + ' · ' + c.area + '㎡ · ' + esc(c.layout) + ' · ' + esc(c.houseStatus) + '</div></div>'
    + '<button class="btn btn-sm" data-action="close-drawer">关闭</button>'
    + '</div>'
    + '<div class="drawer-body">';

  /* 阶段条（可点击切换阶段） */
  const curIdx = STAGE_IDX[c.stage] || 0;
  html += '<div class="stagebar mb-3">';
  STAGES.forEach(function (s) {
    const idx = STAGE_IDX[s.code];
    let cls = '';
    if (s.code === c.stage) cls = ' cur';
    else if (idx < curIdx) cls = ' done';
    else cls = ' todo';
    const mark = idx < curIdx ? '✓ ' : '';
    html += '<div class="stagechip' + cls + '" data-action="set-stage" data-id="' + c.id + '" data-stage="' + s.code + '" title="点击切换到 ' + s.code + ' ' + s.name + '"><b>' + s.code + '</b>' + mark + s.name + '</div>';
  });
  html += '</div>';

  /* 门禁（字段可直接填写） */
  html += '<div class="card mb-3"><div class="card-head"><div class="flex-1"><div class="card-title">交付物门禁</div>'
    + '<div class="card-sub">' + (g ? '推进到 ' + g.to + ' 需齐备下列交付物（可直接填写）' : '已是最后阶段') + '</div></div>'
    + '<span class="badge gate-badge ' + (miss.length ? 'badge-danger' : 'badge-ok') + '">' + (miss.length ? '缺 ' + miss.length + ' 项' : '已齐备') + '</span></div>'
    + '<div class="card-body">';
  if (g) {
    g.need.forEach(function (n) {
      const v = c[n[0]];
      const ok = !(v == null || v === '' || v === 0);
      const inputType = /Date$/.test(n[0]) ? 'date' : (n[0] === 'contractAmount' ? 'number' : 'text');
      html += '<div class="flex items-center gap-2 mb-1"><span class="mini gate-mark">' + (ok ? '✓' : '✕') + '</span>'
        + '<span class="text-sm" style="min-width:92px;flex-shrink:0">' + esc(n[1]) + '</span>'
        + '<input class="input" style="flex:1;padding:5px 8px;font-size:12px" type="' + inputType + '" value="' + esc(String(v == null ? '' : v)) + '"'
        + ' onchange="setGateField(this,\'' + c.id + '\',\'' + n[0] + '\')" placeholder="点击填写' + esc(n[1]) + '"></div>';
    });
  }
  html += '<div class="flex gap-2 mt-2 flex-wrap"><button class="btn btn-sm btn-primary" data-action="advance" data-id="' + c.id + '">推进阶段</button>'
    + '<button class="btn btn-sm" data-action="force-advance" data-id="' + c.id + '">强制推进</button>'
    + '<span class="mini">门禁不通过可点「强制推进」跳过</span></div></div></div>';

  /* 高频操作前置：把跟进/编辑提到前面 */
  html += '<div class="card mb-3" style="background:linear-gradient(90deg,#f0f7f4,#fff);border:1px solid #d8e8e2">'
    + '<div class="card-body" style="padding:10px 14px"><div class="flex gap-2 flex-wrap items-center">'
    + '<span class="mini" style="color:var(--muted)">⚡ 高频：</span>'
    + '<button class="btn btn-primary btn-sm" data-action="record-follow" data-id="' + c.id + '">✍ 记录跟进</button>'
    + '<button class="btn btn-sm" data-action="quick-follow-row" data-id="' + c.id + '">一键快速跟进</button>'
    + '<button class="btn btn-sm" data-action="edit-customer" data-id="' + c.id + '">✎ 编辑资料</button>'
    + '<button class="btn btn-sm" data-action="voice-quick" data-id="' + c.id + '">🎤 语音跟进</button>'
    + '</div></div></div>';

  /* 分阶段资料（不同阶段展示不同填写项与上传项） */
  html += '<div class="card mb-3"><div class="card-head"><div class="flex-1"><div class="card-title">阶段资料</div>'
    + '<div class="card-sub">按阶段展示对应资料 · 单文件 ≤ ' + MAX_FILE_MB + 'MB · 支持图片/视频/DWG/DXF</div></div></div>'
    + '<div class="card-body">' + renderStageForms(c, attBlock) + '</div></div>';

  /* P3-9 跟进记录置顶 · 严格按更新时间倒序 */
  const fups = fuList(c.id);
  html += '<div class="grp-t">跟进记录（' + fups.length + '）</div>';
  if (!fups.length) {
    html += '<div class="sub-card mini">暂无跟进记录 · <button class="btn btn-xs" data-action="record-follow" data-id="' + c.id + '">立即记录</button></div>';
  } else {
    fups.forEach(function (r, i) {
      const upd = r.updated_at ? String(r.updated_at).replace('T', ' ').slice(0, 16) : '';
      html += '<div class="sub-card text-sm"' + (i === 0 ? ' style="border-color:#b8d5c7;background:#f4faf7"' : '') + '>'
        + '<b>' + esc(r.type) + '</b> · ' + esc(r.date)
        + (i === 0 ? ' <span class="cal-badge">最新</span>' : '')
        + (upd ? '<span class="mini text-muted" style="margin-left:6px">更新 ' + esc(upd) + '</span>' : '')
        + '<div style="margin-top:3px">' + esc(r.content) + '</div>'
        + (r.nextAction ? '<div class="mini text-muted" style="margin-top:2px">下一步：' + esc(r.nextAction) + '</div>' : '')
        + '</div>';
    });
  }

  /* P3-11 附件汇总：按阶段分组 */
  const allAtts = (ATT_CACHE[c.id] || []);
  if (allAtts.length) {
    const stageGrouped = {};
    allAtts.forEach(function (a) {
      const key = a.stage || '其他';
      if (!stageGrouped[key]) stageGrouped[key] = [];
      stageGrouped[key].push(a);
    });
    const stageOrder = STAGES.map(function (s) { return s.code; });
    let summaryHtml = '';
    Object.keys(stageGrouped).sort(function (a, b) {
      const ai = stageOrder.indexOf(a); const bi = stageOrder.indexOf(b);
      if (ai >= 0 && bi >= 0) return ai - bi;
      if (ai >= 0) return -1; if (bi >= 0) return 1;
      return a < b ? -1 : 1;
    }).forEach(function (sk) {
      const arr = stageGrouped[sk];
      summaryHtml += '<div style="border-top:1px dashed var(--line);padding:6px 0">'
        + '<div class="mini text-muted">' + sk + ' · ' + arr.length + ' 个</div>';
      arr.forEach(function (a) {
        const canPreview = isImageName(a.file_name, a.mime) || isVideoName(a.file_name, a.mime);
        const previewBtn = canPreview
          ? '<button class="btn btn-xs" style="cursor:pointer" onclick="'
            + (isVideoName(a.file_name, a.mime) ? 'openVideoPlayer' : 'openLightbox')
            + '(\'' + a.id + '\')">预览</button>'
          : '';
        summaryHtml += '<div class="flex items-center gap-2 mini" style="margin-top:2px">'
          + '<span class="truncate" style="flex:1">' + esc(a.file_name) + '</span>'
          + '<span class="text-muted">' + fmtSize(a.size) + '</span>'
          + previewBtn
          + '<button class="btn btn-xs" style="cursor:pointer" onclick="openAttachment(\'' + a.id + '\')">下载</button>'
          + '</div>';
      });
      summaryHtml += '</div>';
    });
    html += '<details style="margin-top:10px">'
      + '<summary style="cursor:pointer;font-weight:600;font-size:13px;padding:5px 0;color:var(--primary)">📋 全部附件汇总（' + allAtts.length + ' 个）</summary>'
      + '<div style="padding:4px 0">' + summaryHtml + '</div></details>';
  }

  /* 基础信息 */
  html += '<div class="grp-t">基础信息</div><div class="card"><div class="card-body"><div class="kv">'
    + kv('联系电话', c.phone) + kv('小区', c.community) + kv('面积 / 户型', c.area + '㎡ / ' + c.layout)
    + kv('房态', c.houseStatus) + kv('线索来源', c.source) + kv('来源明细', c.sourceNote)
    + kv('决策人', c.decider) + kv('预算区间', money(c.budgetMin) + ' ~ ' + money(c.budgetMax))
    + kv('建档日期', c.createdDate) + kv('负责设计师', c.designer) + kv('当前阶段', c.stage + ' ' + STAGE_MAP[c.stage])
    + kv('本阶段停留', stageStay(c) + ' 天')
    + '</div></div></div>';

  /* 阶段进度 */
  html += '<div class="grp-t">阶段进度</div><div class="card"><div class="card-body"><div class="kv">'
    + kv('初次沟通', c.firstContact) + kv('邀约量房', c.visitApptDate) + kv('到场人员', c.attendees)
    + kv('量房日期', c.measureDate) + kv('现场资料', c.siteLink)
    + kv('报告交付', c.reportDeliverDate) + kv('客户反馈', c.clientFeedback)
    + kv('方案版本', c.planVersion) + kv('方案交付', c.planDeliverDate)
    + kv('报价版本', c.quoteVersion) + kv('预算共识', c.budgetAgreed)
    + kv('定金', money(c.depositAmount) + ' · ' + (c.depositDate || ''))
    + kv('设计合同', c.designContractDate) + kv('施工合同', c.buildContractDate)
    + kv('合同金额', c.contractAmount ? money(c.contractAmount) : '')
    + kv('开工日期', c.startDate) + kv('拆除交底', c.demolitionBriefDate)
    + kv('水电交底', c.briefElectric) + kv('木工交底', c.briefWood)
    + kv('瓦工交底', c.briefMason) + kv('油工交底', c.briefPaint)
    + kv('主材截止', c.materialDeadline)
    + kv('竣工日期', c.finishDate) + kv('维保到期', c.warrantyEnd)
    + '</div></div></div>';

  /* 风险与归档 */
  html += '<div class="grp-t">风险与归档</div><div class="card"><div class="card-body"><div class="kv">'
    + kv('逾期', overdueDays(c) > 0 ? '逾期 ' + overdueDays(c) + ' 天' : '正常')
    + kv('下次跟进', c.nextFollowDate) + kv('上次跟进', c.lastFollowDate)
    + kv('沉默天数', silenceDays(c) + ' 天 · ' + (sleepLevel(c) === 'sleep' ? '已判沉睡' : (sleepLevel(c) === 'warn' ? '沉默预警' : '正常')))
    + kv('客户顾虑', c.concerns) + kv('竞品情况', c.competitor)
    + kv('变更次数', changeCount(c) + ' 次') + kv('累计增项', c.contractAmount ? money(changeAmount(c)) : '—')
    + kv('客户状态', c.status)
    + '</div></div></div>';

  /* 归档路径 */
  html += '<div class="grp-t">一客一档</div><div class="card"><div class="card-body">'
    + '<div class="pathbox" id="pathBox">' + esc(buildTree(c)) + '</div>'
    + '<div class="copy-line mt-2"><button class="btn btn-sm" data-action="copy-path" data-id="' + c.id + '">复制目录结构</button>'
    + '<button class="btn btn-sm" data-action="open-obsidian" data-id="' + c.id + '">在 Obsidian 打开</button>'
    + '<span class="mini">本地文件夹需桌面端 Obsidian 支持</span></div></div></div>';

  /* 子表 */
  SUB_TABLES.filter(function (t) { return t.id !== 'followUps'; }).forEach(function (t) {
    const rows = DB[t.id].filter(function (x) { return x.customerId === c.id; });
    html += '<div class="grp-t">' + t.name + '（' + rows.length + '）</div>';
    if (!rows.length) { html += '<div class="sub-card mini">暂无记录</div>'; return; }
    rows.forEach(function (r) {
      let line = '';
      if (t.id === 'followUps') line = r.date + ' · ' + esc(r.type) + '　' + esc(r.content) + '<br><span class="mini">下一步：' + esc(r.nextAction || '—') + '</span>';
      else if (t.id === 'versions') line = r.version + ' · ' + r.date + ' · ' + r.summary + '　<span class="mini">' + esc(r.status) + '</span>';
      else if (t.id === 'briefings') line = r.node + ' · ' + r.date + '　' + r.attendees + '<br><span class="mini">' + esc(r.issues) + ' · ' + esc(r.signed) + '</span>';
      else if (t.id === 'changes') line = r.date + ' · ' + r.content + '　<b>+' + money(r.amount) + '</b><br><span class="mini">' + esc(r.confirmed) + '</span>';
      else line = r.category + ' · ' + r.brand + ' ' + esc(r.spec) + '　<span class="mini">' + esc(r.status) + '</span>';
      html += '<div class="sub-card text-sm">' + line + '</div>';
    });
  });

  /* 本客户提醒 */
  const myRem = ruleItems().filter(function (x) { return x.cid === c.id; });
  html += '<div class="grp-t">该客户节点提醒（' + myRem.length + '）</div>';
  if (!myRem.length) html += '<div class="sub-card mini">暂无节点提醒</div>';
  myRem.forEach(function (r) {
    const st = dueState(r.due);
    html += '<div class="sub-card text-sm flex items-center gap-2"><div class="flex-1">' + esc(r.rule)
      + '<div class="mini">' + esc(r.detail) + '</div></div>'
      + '<span class="badge ' + st.cls + '">' + st.label + '</span></div>';
  });

  /* 操作 */
  const escapeBtn = c.escaped
    ? '<button class="btn" data-action="restore-customer" data-id="' + c.id + '">↩ 恢复客户</button>'
    : '<button class="btn" style="color:#d64545;border-color:#e8c4c4" data-action="mark-escaped" data-id="' + c.id + '">⚠ 标记逃单</button>';
  html += '<div class="flex gap-2 mt-4 flex-wrap">'
    + '<button class="btn btn-primary" data-action="record-follow" data-id="' + c.id + '">记录跟进</button>'
    + '<button class="btn" data-action="edit-customer" data-id="' + c.id + '">✎ 编辑资料</button>'
    + '<button class="btn" data-action="voice-quick" data-id="' + c.id + '">🎤 语音跟进</button>'
    + '<button class="btn" data-action="copy-feishu" data-id="' + c.id + '">复制飞书链接</button>'
    + escapeBtn
    + '<button class="btn" style="color:#b03030;border-color:#e8c4c4" data-action="delete-customer" data-id="' + c.id + '">🗑 删除客户</button>'
    + '</div>';

  /* 客户分类（每项一个单独按钮） */
  if (!c.escaped) {
    html += '<div class="grp-t">客户分类（点击即归类，并跳到该类页面）</div>';
    html += '<div class="flex gap-2 flex-wrap">';
    CLASSIFY.forEach(function (b) {
      const on = c.classified === b.k;
      html += '<button class="btn btn-sm" data-action="classify" data-id="' + c.id + '" data-bucket="' + b.k + '"'
        + (on ? ' style="background:var(--primary);color:#fff;border-color:var(--primary)"' : '') + '>'
        + (on ? '✓ ' : '') + b.label + '</button>';
    });
    if (c.classified) {
      html += '<button class="btn btn-sm" data-action="classify-clear" data-id="' + c.id + '">清除分类</button>';
    }
    html += '</div>';
    html += '<div class="mini mt-2">当前分类：' + esc(c.classified
      ? CLASSIFY_LABELS[c.classified] + '（' + (c.classified_at || '—') + '）'
      : '未分类 · 跟随自动规则') + '</div>';
  }

  html += '</div></div>';
  return html;
}

function buildTree(c) {
  const root = c.obsidianPath || ('恒彩客户库/' + c.name + '-' + c.community + '-' + c.area + '㎡');
  const subs = ['01 基础资料', '02 沟通记录', '03 量房资料', '04 方案版本', '05 报价与合同',

function saveFollowRecord(id) {
  const c = cust(id);
  if (!c) return;
  const content = (document.getElementById('fu_content') || {}).value.trim();
  if (!content) { toast('请填写跟进内容'); return; }
  const type = (document.getElementById('fu_type') || {}).value || '电话';
  const nextDate = (document.getElementById('fu_date') || {}).value || shift(3);
  const nextAction = ((document.getElementById('fu_next') || {}).value || '').trim();
  const concerns = ((document.getElementById('fu_concerns') || {}).value || '').trim();
  DB.followUps.push({
    id: 'F' + Date.now(), customerId: id, date: TODAY,
    updated_at: new Date().toISOString(),
    type: type, content: content, nextAction: nextAction || '待跟进',
    nextFollowDate: nextDate, operator: c.designer || '本人'
  });
  c.lastFollowDate = TODAY;
  c.nextFollowDate = nextDate;
  if (concerns) c.concerns = concerns;
  const syncEl = document.getElementById('fu_sync');
  if (syncEl && syncEl.checked) {
    const g = gateInfo(c.stage);
    const miss = g ? missingFields(c, g.need) : [];
    if (miss.length) {
      const fk = miss[0][0];
      c[fk] = /Date$/.test(fk) ? nextDate : content;
    }
  }
  saveDB();
  auditWrite(id, 'follow_up', { content: content.slice(0, 80), nextDate: nextDate });
  document.getElementById('modal').classList.remove('open');
  render();
  toast('已记录跟进，下次 ' + nextDate);
}

let tenantLoading = false;

function renderTenants() {
  if (!isAdmin()) return '<div class="card"><div class="card-body">仅超级管理员可访问</div></div>';
  if (!HC_SB) return '<div class="card"><div class="card-body">未连接云端，无法查看租户</div></div>';
  if (!TENANT_LIST) {
    refreshTenants();
    return '<div class="card"><div class="card-body">正在加载租户列表…</div></div>';
  }
  const STORAGE_QUOTA_BYTES = 1024 * 1024 * 1024;  // 单租户 1 GB 软配额
  const STORAGE_WARN_BYTES = 800 * 1024 * 1024;    // 超过 800 MB 预警
  const totalCust = TENANT_LIST.reduce(function (s, t) { return s + Number(t.customer_count || 0); }, 0);
  const totalFile = TENANT_LIST.reduce(function (s, t) { return s + Number(t.file_count || 0); }, 0);
  const totalSize = TENANT_LIST.reduce(function (s, t) { return s + Number(t.storage_bytes || 0); }, 0);
  const active = TENANT_LIST.filter(function (t) { return t.status === 'active'; }).length;
  const overList = TENANT_LIST.filter(function (t) { return Number(t.storage_bytes || 0) >= STORAGE_WARN_BYTES; });

  let html = '<div class="grid grid-4 mb-3">'
    + '<div class="card"><div class="card-body"><div class="mini text-muted">租户总数</div><div style="font-size:24px;font-weight:700">' + TENANT_LIST.length + '</div><div class="mini text-muted">启用 ' + active + ' 个</div></div></div>'
    + '<div class="card"><div class="card-body"><div class="mini text-muted">客户总数</div><div style="font-size:24px;font-weight:700">' + totalCust + '</div></div></div>'
    + '<div class="card"><div class="card-body"><div class="mini text-muted">附件总数</div><div style="font-size:24px;font-weight:700">' + totalFile + '</div></div></div>'
    + '<div class="card"><div class="card-body"><div class="mini text-muted">占用存储</div><div style="font-size:24px;font-weight:700">' + fmtSize(totalSize) + '</div></div></div>'
    + '</div>';

  if (overList.length) {
    html += '<div class="card mb-3" style="border-color:#f0c2c2;background:#fdf3f3"><div class="card-body">'
      + '<div style="font-size:13px;color:#b03030;font-weight:600">⚠ 存储占用预警：'
      + overList.map(function (t) { return esc(t.name || '未命名'); }).join('、')
      + ' 已超过 800 MB</div>'
      + '<div class="mini" style="color:#8a5a5a;margin-top:4px">建议提醒对应租户清理历史图纸，或压缩图片后重新上传（单租户软配额 1 GB）。</div>'
      + '</div></div>';
  }

  html += '<div class="card"><div class="card-head"><div class="flex-1"><div class="card-title">租户列表</div>'
    + '<div class="card-sub">点「进入查看」可查看并编辑该租户数据（所有改动会记入审计日志）</div></div>'
    + '<button class="btn btn-sm" data-action="refresh-tenants">刷新</button></div>'
    + '<div class="card-body" style="padding:0"><table class="tbl"><thead><tr>'
    + '<th>租户名称</th><th>状态</th><th>客户</th><th>附件</th><th>存储</th><th>最后活跃</th><th style="text-align:right">操作</th>'
    + '</tr></thead><tbody>';
  TENANT_LIST.forEach(function (t) {
    const isSelf = ME && t.id === ME.tenant_id;
    const on = t.status === 'active';
    const bytes = Number(t.storage_bytes || 0);
    const pct = Math.min(100, (bytes / STORAGE_QUOTA_BYTES) * 100).toFixed(1);
    const warn = bytes >= STORAGE_WARN_BYTES;
    html += '<tr>'
      + '<td><div class="font-semibold">' + esc(t.name || '未命名') + (isSelf ? ' <span class="mini text-muted">(本租户)</span>' : '') + '</div>'
      + '<div class="mini text-muted">' + t.id.slice(0, 8) + '…</div></td>'
      + '<td><span class="pill" style="' + (on ? 'background:#e6f4ec;color:#1c7c4a' : 'background:#fbe9e9;color:#b03030') + '">' + (on ? '启用' : '已停用') + '</span></td>'
      + '<td>' + Number(t.customer_count || 0) + '</td>'
      + '<td>' + Number(t.file_count || 0) + '</td>'
      + '<td><div class="mini"' + (warn ? ' style="color:#b03030;font-weight:600"' : '') + '>' + fmtSize(bytes) + (warn ? ' · 偏高' : '') + '</div>'
      + '<div style="height:5px;width:88px;background:#eef2f1;border-radius:3px;overflow:hidden;margin-top:3px">'
      + '<div style="height:100%;width:' + pct + '%;background:' + (warn ? '#d64545' : '#1a5c4b') + '"></div></div></td>'
      + '<td class="mini">' + (t.updated_at ? String(t.updated_at).replace('T', ' ').slice(0, 16) : '—') + '</td>'
      + '<td style="text-align:right;white-space:nowrap">'
      + (isSelf ? '' : '<button class="btn btn-sm" data-action="switch-tenant" data-id="' + t.id + '">进入查看</button> ')
      + (isSelf ? '' : '<button class="btn btn-sm" data-action="admin-reset-pwd" data-id="' + t.id + '" data-name="' + esc(t.name || '未命名') + '">重置密码</button> ')
      + '<button class="btn btn-sm" data-action="tenant-status" data-id="' + t.id + '" data-status="' + (on ? 'disabled' : 'active') + '"'
      + (isSelf ? ' disabled' : '') + '>' + (on ? '停用' : '启用') + '</button>'
      + '</td></tr>';
  });
  html += '</tbody></table></div></div>';
  return html;
}
function switchTenant(tid) {
  if (!isAdmin()) return;
  ACTIVE_TENANT = tid;
  Object.keys(ATT_CACHE).forEach(function (k) { delete ATT_CACHE[k]; });
  Object.keys(ATT_URL).forEach(function (k) { delete ATT_URL[k]; });
  DB = emptyDB();
  state.drawerId = null;
  state.view = 'today';
  SYNC_LOCK = true;
  showSyncLoading('正在读取该租户数据…');
  cloudPull(function (st) {
    SYNC_LOCK = false;
    if (st === 'error') {
      ACTIVE_TENANT = ME.tenant_id;
      DB = emptyDB();
      state.view = 'tenants';
      render();
      toast('读取该租户数据失败，已返回租户列表');
      return;
    }
    if (st === 'empty') DB = emptyDB();
    render();
    toast(st === 'empty' ? '该租户暂无数据，已进入空工作区' : '已进入该租户');
  });
}
function exitTenant() {
  if (!isAdmin() || !ME) return;
  ACTIVE_TENANT = ME.tenant_id;
  Object.keys(ATT_CACHE).forEach(function (k) { delete ATT_CACHE[k]; });
  Object.keys(ATT_URL).forEach(function (k) { delete ATT_URL[k]; });
  DB = emptyDB();
  state.drawerId = null;
  state.view = 'tenants';
  SYNC_LOCK = true;
  showSyncLoading('正在返回本租户数据…');
  cloudPull(function (st) {
    SYNC_LOCK = false;
    if (st !== 'ok') DB = emptyDB();
    render();
    toast(st === 'error' ? '读取本租户数据失败，请刷新页面重试' : '已退出，返回本租户');
  });
}
function setTenantStatus(tid, status) {
  if (!isAdmin() || !HC_SB) return;
  const label = status === 'active' ? '启用' : '停用';
  if (status === 'disabled' && !confirm('确认停用该租户？停用后该账号将无法正常使用系统。')) return;
  HC_SB.from('tenants').update({
    status: status,
    disabled_at: status === 'disabled' ? new Date().toISOString() : null
  }).eq('id', tid).then(function (r) {
    if (r && r.error) { toast('操作失败：' + r.error.message); return; }
    toast(label + '成功');
    TENANT_LIST = null;
    refreshTenants();
    render();
  });
}
