n-top:18px}.field label{display:block;margin-bottom:8px;color:#58645d;font-size:13px;font-weight:750}.field input{width:100%;height:48px;padding:0 14px;border:1px solid #ccd5cf;border-radius:7px;background:#fff;color:#17232d;font-size:21px;font-weight:800;letter-spacing:.18em;text-align:center;outline:none}.field input::placeholder{color:#a0aaa4;font-size:14px;font-weight:600;letter-spacing:0}.field input:focus{border-color:#7da18e;box-shadow:0 0 0 3px rgba(47,107,81,.09)}button{width:100%;height:46px;margin-top:12px;border:0;border-radius:7px;background:#17232d;color:#fff;font-size:14px;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:40px;margin-top:12px;padding:10px 12px;border-radius:7px;color:#68736c;background:#f6f7f6;font-size:13px;line-height:1.5}.message.error{color:#a94432;background:#fff4f1}.message.success{color:#286344;background:#edf7f1}.back{display:block;margin-top:18px;color:#2f6b51;text-align:center;text-decoration:none;font-size:13px;font-weight:750}@media(max-width:720px){.wrap{padding:14px}.panel{grid-template-columns:1fr}.intro{padding:30px}.redeem{padding:28px;border-left:0;border-top:1px solid #e1e6e2}h1{font-size:26px}}.group{position:relative;padding:24px 18px;border:2px solid #79a58e;background:#edf7f1;box-shadow:0 10px 28px rgba(47,107,81,.1)}.group::before{content:'第一步 · 扫码加入微信群';display:block;margin-bottom:15px;color:#2f6b51;font-size:13px;font-weight:850}.group img{width:210px;height:210px}.group strong{font-size:18px;color:#17232d}.group span{margin-top:7px;font-size:13px;color:#506159}.field{padding-top:16px;border-top:1px solid #e2e7e3}.message{background:#edf7f1;color:#456151}@media(max-width:720px){.group img{width:190px;height:190px}}</style></head><body data-inspector-id="html:0c241e66:1"><main class="wrap" data-inspector-id="html:0c241e66:2"><section class="panel" data-inspector-id="html:0c241e66:3"><div class="intro" data-inspector-id="html:0c241e66:4"><div class="icon" data-inspector-id="html:0c241e66:5">▦</div><h1 data-inspector-id="html:0c241e66:6">进群领取瓷砖排版工具使用资格</h1><p data-inspector-id="html:0c241e66:7">扫码加入装修小账本装修微信群，在群公告中领取邀请码，验证后即可使用瓷砖排版工具。</p><ol class="steps" data-inspector-id="html:0c241e66:8"><li data-inspector-id="html:0c241e66:9"><b data-inspector-id="html:0c241e66:10">1</b><span data-inspector-id="html:0c241e66:11">扫码加入装修小账本装修微信群</span></li><li data-inspector-id="html:0c241e66:12"><b data-inspector-id="html:0c241e66:13">2</b><span data-inspector-id="html:0c241e66:14">从群公告领取邀请码</span></li><li data-inspector-id="html:0c241e66:15"><b data-inspector-id="html:0c241e66:16">3</b><span data-inspector-id="html:0c241e66:17">输入邀请码，立即开通工具</span></li></ol></div><div class="redeem" data-inspector-id="html:0c241e66:18"><div class="group" id="groupCard" data-inspector-id="html:0c241e66:19"><img id="groupQr" alt="装修交流群二维码" data-inspector-id="html:0c241e66:20" src="https://jz.jhdataops.com/api/community/qr-image?v=a68ec20ec198457b8f1cd174ed610554"><strong id="groupTitle" data-inspector-id="html:0c241e66:21">加入装修小账本装修交流群</strong><span id="groupDesc" data-inspector-id="html:0c241e66:22">交流施工经验、材料选购以及团购优惠；验证备注：进群</span></div><form id="redeemForm" data-inspector-id="html:0c241e66:23"><div class="field" data-inspector-id="html:0c241e66:24"><label for="accessCode" data-inspector-id="html:0c241e66:25">群公告邀请码</label><input id="accessCode" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="请输入 6 位数字" required="" data-inspector-id="html:0c241e66:26"></div><button id="redeemButton" type="submit" data-inspector-id="html:0c241e66:27">验证并开通</button><div class="message" id="message" data-inspector-id="html:0c241e66:28">还没有邀请码？扫码进群后查看群公告。</div></form><a class="back" href="tools.html" data-inspector-id="html:0c241e66:29">返回实用工具</a></div></section></main><script>const card=document.getElementById('groupCard'),qr=document.getElementById('groupQr'),title=document.getElementById('groupTitle'),desc=document.getElementById('groupDesc'),form=document.getElementById('redeemForm'),input=document.getElementById('accessCode'),button=document.getElementById('redeemButton'),message=document.getElementById('message');const STATIC=window.__XZ_STATIC__!==false,ACCESS_KEY='xzreplica.tileAccess';const setMsg=(t,k)=>{message.className='message'+(k?' '+k:'');message.textContent=t};const demoOpen=()=>{message.className='message success';message.innerHTML='已开通本地演示资格。静态版未内置在线排版工具，可先用 <a href="瓷砖用量.html">瓷砖用量计算</a> 估算片数与箱数。';button.textContent='已开通（本地演示）';button.disabled=false};if(STATIC){desc.textContent='当前为本地演示环境：无需进群，输入任意 6 位数字即可开通。正式版会校验群公告邀请码。';if(localStorage.getItem(ACCESS_KEY))demoOpen()}if(!STATIC){fetch('/api/community',{credentials:'same-origin'}).then(r=>r.json()).then(({community:c})=>{title.textContent=c.title||'加入装修交流群';desc.textContent=c.enabled?(c.description||'扫码进群，在群公告中领取邀请码'):'扫码加入微信群，邀请码公布在群公告中';if(c.enabled&&c.qrImageUrl){qr.src=c.qrImageUrl;card.classList.remove('no-qr')}}).catch(()=>{desc.textContent='扫码加入微信群，邀请码公布在群公告中'});}input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,6)});form.addEventListener('submit',async e=>{e.preventDefault();if(!/^\d{6}$/.test(input.value)){message.className='message error';message.textContent='请输入群内领取的 6 位数字邀请码';return}button.disabled=true;button.textContent='正在验证...';if(STATIC){localStorage.setItem(ACCESS_KEY,new Date().toISOString());message.className='message success';message.textContent='演示模式验证通过，正在开通...';setTimeout(demoOpen,500);return}try{const response=await fetch('/api/tile-layout/redeem',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:input.value})});const data=await response.json();if(!response.ok)throw new Error(data.detail||'邀请码验证失败');message.className='message success';message.textContent='开通成功，正在进入瓷砖排版模拟器...';setTimeout(()=>location.reload(),700)}catch(error){message.className='message error';message.textContent=error instanceof TypeError?'暂时无法连接服务器，请刷新页面后重试':error.message}finally{button.disabled=false;button.textContent='验证并开通'}});</script></body></html>
