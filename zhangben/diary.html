<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>装修小账本 - 装修日记</title>
  <link rel="icon" type="image/svg+xml" href="assets/yellow/logo.svg">
  <link rel="stylesheet" href="css/fresh.css">
  <style>
    /* 装修日记（对齐原版 装修日记.html） */
    .diary-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin: 0 0 16px; }
    .diary-head h1 { margin: 0; font-size: 28px; font-weight: 600; line-height: 1.35; }
    .diary-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .diary-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 18px;
      border: 1px solid #E9ECEC;
      border-radius: 10px;
      background: #fff;
      color: #596166;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }
    .diary-btn-p {
      min-height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 10px;
      background: var(--coral);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .diary-btn-p:hover { background: var(--coral-deep); }

    /* 统计 */
    .diary-stats { display: flex; gap: 10px; margin-bottom: 16px; }
    .diary-stat {
      flex: 1;
      padding: 10px 16px;
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fff;
      font-size: 13px;
      text-align: center;
      color: #292D2E;
    }
    .diary-stat strong { display: block; color: #8B7425; font-size: 18px; }

    /* 空状态 */
    .diary-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 388px;
      padding: 42px 28px;
      border: 0;
      border-radius: 16px;
      background: #F7F8F8;
      color: #70767B;
      text-align: center;
      font-size: 15px;
    }
    .diary-empty .empty-icon {
      position: relative;
      width: 70px;
      height: 70px;
      margin: 0 0 18px;
    }
    .diary-empty .empty-icon::before {
      content: "";
      position: absolute;
      inset: 17px 20px;
      border: 2px solid #858D91;
      border-radius: 5px;
      box-shadow: -5px 0 0 -3px #858D91;
    }
    .diary-empty .empty-icon::after {
      content: "";
      position: absolute;
      left: 29px;
      top: 29px;
      width: 14px;
      height: 2px;
      background: #858D91;
      box-shadow: 0 7px 0 #858D91;
    }
    .diary-empty p { margin: 0 0 20px; }
    .diary-empty p strong { display: block; color: #292D2E; font-size: 20px; font-weight: 700; }
    .diary-empty p small { display: block; max-width: 520px; margin-top: 8px; color: #70767B; font-size: 13px; line-height: 1.7; }

    /* 日记卡片 */
    .diary-card {
      margin-bottom: 14px;
      border: 1px solid #eee;
      border-radius: 16px;
      background: #fff;
      overflow: hidden;
      transition: all .2s;
    }
    .diary-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.04); }
    .diary-card-hd { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #f5f5f5; }
    .diary-date { padding: 3px 8px; border-radius: 6px; background: #f5f5f5; color: #999; font-size: 12px; white-space: nowrap; }
    .diary-title { flex: 1; font-size: 15px; font-weight: 600; color: #292D2E; }
    .diary-card-actions { display: flex; gap: 4px; }
    .diary-card-actions .btn {
      min-height: 30px;
      padding: 0 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #666;
      font-size: 12px;
      font-weight: 600;
      box-shadow: none;
    }
    .diary-card-actions .btn:hover { border-color: var(--coral); color: var(--coral); }
    .diary-card-actions .btn.del { border: 1px solid #fecaca; background: #fee2e2; color: #dc2626; }
    .diary-card-actions .btn.del:hover { background: #fecaca; }
    .diary-card-bd { padding: 14px 18px; }
    .diary-content { color: #555; font-size: 13px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
    .diary-images { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 10px; }
    .diary-images img { width: 100%; aspect-ratio: 1; border-radius: 8px; object-fit: cover; cursor: pointer; transition: transform .2s; }
    .diary-images img:hover { transform: scale(1.02); }

    /* 编辑器 */
    .editor-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2200;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: rgba(0,0,0,.5);
      overflow: hidden;
    }
    .editor-overlay.show { display: flex; }
    .editor {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 560px;
      max-height: calc(100dvh - 48px);
      border-radius: 20px;
      background: #fff;
      overflow: hidden;
      animation: diarySlideUp .3s ease;
    }
    @keyframes diarySlideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    .editor-hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; }
    .editor-hd h3 { margin: 0; font-size: 16px; font-weight: 700; }
    .editor-close { padding: 4px; border: 0; background: none; color: #999; font-size: 20px; line-height: 1; cursor: pointer; }
    .editor-bd { min-height: 0; padding: 20px; overflow-y: auto; }
    .editor-ft { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid #f0f0f0; flex-shrink: 0; }
    .editor-ft .hint { margin-right: auto; color: #999; font-size: 12px; }
    .editor-ft .btn { min-height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12px; font-weight: 600; box-shadow: none; }
    .diary-field { margin-bottom: 14px; }
    .diary-field label { display: block; margin-bottom: 4px; color: #666; font-size: 12px; font-weight: 500; }
    .diary-field .input { width: 100%; padding: 8px 12px; border: 1.5px solid #e8e8e8; border-radius: 10px; background: #fff; color: #292D2E; font-size: 13px; outline: none; }
    .diary-field .input:focus { border-color: var(--coral); box-shadow: 0 0 0 3px rgba(228,91,63,.08); }
    .diary-field textarea.input { min-height: 100px; line-height: 1.6; resize: vertical; }
    .img-upload { display: flex; flex-wrap: wrap; gap: 8px; }
    .img-upload .img-thumb { position: relative; width: 80px; height: 80px; border-radius: 10px; overflow: hidden; }
    .img-upload .img-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .img-upload .img-thumb .del-img {
      position: absolute;
      top: 2px;
      right: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.6);
      color: #fff;
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
    }
    .img-upload .add-img {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border: 2px dashed #ddd;
      border-radius: 10px;
      color: #ccc;
      font-size: 24px;
      cursor: pointer;
      transition: all .2s;
    }
    .img-upload .add-img:hover { border-color: var(--coral); color: var(--coral); }
    .img-upload .add-img .ic { width: 24px; height: 24px; }

    /* 图片预览 */
    .preview-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 2300;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.9);
      cursor: pointer;
    }
    .preview-overlay.show { display: flex; }
    .preview-overlay img { max-width: 90%; max-height: 90%; border-radius: 8px; }
    .preview-overlay img:not([src]) { min-width: 160px; min-height: 120px; border: 1px dashed #d9e2dc; background: #f5f7f5; }

    @media (max-width: 768px) {
      .diary-head h1 { font-size: 24px; }
      .diary-images { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="diary-head">
      <h1>装修日记</h1>
      <div class="diary-head-actions">
        <a class="diary-back" href="tools.html">← 返回工具</a>
        <button class="diary-btn-p" id="diaryPrimaryBtn" onclick="openEditor()" hidden>写日记</button>
      </div>
    </div>

    <div class="diary-stats" id="statsArea">
      <div class="diary-stat"><strong>0</strong>篇日记</div>
      <div class="diary-stat"><strong>0</strong>天记录</div>
      <div class="diary-stat"><strong>0</strong>张照片</div>
    </div>

    <div id="diaryList"></div>
  </main>

  <!-- 编辑器 -->
  <div class="editor-overlay" id="editorOverlay" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
    <div class="editor">
      <div class="editor-hd">
        <h3 id="editorTitle">写日记</h3>
        <button class="editor-close" onclick="closeEditor()" aria-label="关闭">✕</button>
      </div>
      <div class="editor-bd">
        <div class="diary-field">
          <label for="diaryTitle">标题</label>
          <input type="text" class="input" id="diaryTitle" aria-label="标题" placeholder="今天的装修进展...">
        </div>
        <div class="diary-field">
          <label for="diaryDate">日期</label>
          <input type="date" class="input" id="diaryDate" aria-label="日期">
        </div>
        <div class="diary-field">
          <label for="diaryStage">装修阶段</label>
          <select class="input" id="diaryStage" aria-label="装修阶段">
            <option>施工记录</option>
            <option>准备阶段</option>
            <option>拆改阶段</option>
            <option>水电阶段</option>
            <option>瓦工阶段</option>
            <option>木工阶段</option>
            <option>油漆阶段</option>
            <option>安装阶段</option>
            <option>软装入住</option>
          </select>
        </div>
        <div class="diary-field">
          <label for="diaryContent">内容</label>
          <textarea class="input" id="diaryContent" aria-label="内容" placeholder="记录今天做了什么、遇到了什么问题、花了多少钱..."></textarea>
        </div>
        <div class="diary-field">
          <label>照片（可选，最多9张）</label>
          <div class="img-upload" id="imgUpload"></div>
          <input type="file" id="imgInput" accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp" aria-label="选择照片" multiple hidden>
        </div>
      </div>
      <div class="editor-ft">
        <span class="hint">内容自动保存</span>
        <button class="btn" onclick="closeEditor()">稍后再写</button>
        <button class="btn primary" onclick="saveDiary()">保存</button>
      </div>
    </div>
  </div>

  <!-- 图片预览 -->
  <div class="preview-overlay" id="previewOverlay" role="dialog" aria-modal="true" aria-label="照片预览" tabindex="-1">
    <img id="previewImg" alt="装修日记照片预览">
  </div>

  <script src="js/shell.js?v=20261109-snap"></script>
  <script>
    shell.renderNav('diary');
    shell.store.seed();
    const $ = id => document.getElementById(id);

    let entries = shell.store.read('diary', []);
    let editingId = null;
    let currentImages = [];
    let draftTimer = null;

    const esc = s => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
    const escText = s => esc(s).replace(/\n/g, '<br>');
    const save = () => shell.store.write('diary', entries);

    /* ---------- 列表 ---------- */
    function sorted() {
      return entries.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    }

    function renderDiaries() {
      const list = sorted();
      $('diaryPrimaryBtn').hidden = list.length === 0;

      const days = new Set(list.map(d => d.date)).size;
      const photos = list.reduce((n, d) => n + ((d.images || []).length), 0);
      $('statsArea').innerHTML =
        '<div class="diary-stat"><strong>' + list.length + '</strong>篇日记</div>' +
        '<div class="diary-stat"><strong>' + days + '</strong>天记录</div>' +
        '<div class="diary-stat"><strong>' + photos + '</strong>张照片</div>';

      const box = $('diaryList');
      if (!list.length) {
        box.innerHTML =
          '<div class="diary-empty">' +
            '<div class="empty-icon" aria-hidden="true"></div>' +
            '<p><strong>从第一条现场记录开始</strong><small>把施工进展、验收结果和重要照片集中留档，之后查找更方便。</small></p>' +
            '<button class="diary-btn-p" onclick="openEditor()">写第一篇日记</button>' +
          '</div>';
        return;
      }

      box.innerHTML = '';
      list.forEach(d => {
        const imgs = (d.images || []).filter(Boolean);
        const imgsHtml = imgs.length
          ? '<div class="diary-images">' + imgs.map((src, i) =>
              '<img src="' + esc(src) + '" alt="装修日记照片" loading="lazy" data-idx="' + i + '">').join('') + '</div>'
          : '';
        const card = document.createElement('div');
        card.className = 'diary-card';
        card.dataset.id = d.id;
        card.innerHTML =
          '<div class="diary-card-hd">' +
            '<span class="diary-date">📅 ' + esc(d.date) + '</span>' +
            '<span class="diary-title">' + esc(d.title || '未命名日记') + '</span>' +
            '<div class="diary-card-actions">' +
              '<button class="btn edit">编辑</button>' +
              '<button class="btn del">删除</button>' +
            '</div>' +
          '</div>' +
          '<div class="diary-card-bd">' +
            '<div class="diary-content">' + escText(d.content) + '</div>' +
            imgsHtml +
          '</div>';

        card.querySelector('.edit').onclick = () => openEditor(d.id);
        card.querySelector('.del').onclick = () => {
          if (!confirm('确定删除这篇日记？')) return;
          entries = entries.filter(x => x.id !== d.id);
          save();
          renderDiaries();
        };
        card.querySelectorAll('.diary-images img').forEach(img => {
          img.onclick = () => previewImg(img.src);
        });
        box.appendChild(card);
      });
    }

    /* ---------- 编辑器 ---------- */
    function openEditor(id) {
      editingId = id ? String(id) : null;
      currentImages = [];
      $('editorTitle').textContent = id ? '编辑日记' : '写日记';
      $('diaryTitle').value = '';
      $('diaryDate').value = shell.fmt.today();
      $('diaryStage').value = '准备阶段';
      $('diaryContent').value = '';

      if (id) {
        const d = entries.find(x => String(x.id) === String(id));
        if (d) {
          $('diaryTitle').value = d.title || '';
          $('diaryDate').value = d.date || shell.fmt.today();
          $('diaryContent').value = d.content || '';
          $('diaryStage').value = d.stage || '施工记录';
          currentImages = (d.images || []).slice();
        }
      } else {
        const draft = shell.store.read('diaryDraft', null);
        if (draft && (draft.title || draft.content || (draft.images && draft.images.length))) {
          $('diaryTitle').value = draft.title || '';
          $('diaryDate').value = draft.date || shell.fmt.today();
          $('diaryContent').value = draft.content || '';
          $('diaryStage').value = draft.stage || '准备阶段';
          currentImages = Array.isArray(draft.images) ? draft.images.slice() : [];
        }
      }
      renderImages();
      $('editorOverlay').classList.add('show');
      $('diaryTitle').focus();
    }

    function closeEditor(keepDraft) {
      if (keepDraft !== false) saveDraft();
      $('editorOverlay').classList.remove('show');
      editingId = null;
      currentImages = [];
      shell.dialog.restoreFocus();
    }

    function saveDraft() {
      if (editingId) return;
      const title = $('diaryTitle').value.trim();
      const date = $('diaryDate').value;
      const content = $('diaryContent').value.trim();
      const stage = $('diaryStage').value || '准备阶段';
      if (!title && !content && !currentImages.length) {
        shell.store.write('diaryDraft', null);
        return;
      }
      shell.store.write('diaryDraft', { title, date, stage, content, images: currentImages.slice() });
    }
    function scheduleDraft() {
      clearTimeout(draftTimer);
      draftTimer = setTimeout(saveDraft, 250);
    }

    /* ---------- 图片 ---------- */
    function renderImages() {
      const box = $('imgUpload');
      let html = '';
      currentImages.forEach((src, i) => {
        html += '<div class="img-thumb"><img src="' + esc(src) + '" alt="待保存照片">' +
          '<button class="del-img" data-i="' + i + '" aria-label="删除照片">✕</button></div>';
      });
      if (currentImages.length < 9) html += '<label class="add-img" id="addImgBtn">' + shell.icon('plus') + '</label>';
      box.innerHTML = html;
      const add = $('addImgBtn');
      if (add) add.onclick = () => $('imgInput').click();
      box.querySelectorAll('.del-img').forEach(btn => {
        btn.onclick = () => {
          currentImages.splice(Number(btn.dataset.i), 1);
          scheduleDraft();
          renderImages();
        };
      });
    }

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const maxEdge = 1200;
          const scale = Math.min(1, maxEdge / Math.max(img.naturalWidth, img.naturalHeight));
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(1, Math.round(img.naturalWidth * scale));
          canvas.height = Math.max(1, Math.round(img.naturalHeight * scale));
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', .8));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片无法读取')); };
        img.src = url;
      });
    }

    $('imgInput').addEventListener('change', async e => {
      const files = Array.from(e.target.files || []);
      if (currentImages.length + files.length > 9) {
        shell.toast('最多上传 9 张照片');
        e.target.value = '';
        return;
      }
      for (const file of files) {
        try {
          currentImages.push(await compressImage(file));
        } catch (err) {
          shell.toast(err.message || '图片读取失败');
        }
      }
      e.target.value = '';
      scheduleDraft();
      renderImages();
    });

    /* ---------- 保存 / 预览 ---------- */
    function saveDiary() {
      const title = $('diaryTitle').value.trim();
      const date = $('diaryDate').value;
      const content = $('diaryContent').value.trim();
      const stage = $('diaryStage').value || '准备阶段';
      if (!title) { shell.toast('请输入标题'); return; }
      if (!date) { shell.toast('请选择日期'); return; }
      if (!content) { shell.toast('请输入内容'); return; }

      if (editingId) {
        const item = entries.find(x => String(x.id) === String(editingId));
        if (item) Object.assign(item, { title, date, stage, content, images: currentImages.slice() });
      } else {
        entries.push({ id: shell.store.uid(), title, date, stage, content, images: currentImages.slice() });
      }
      if (!save()) {
        shell.toast('本机存储空间不足，请减少照片或删除旧日记后重试');
        return;
      }
      shell.store.write('diaryDraft', null);
      closeEditor(false);
      renderDiaries();
      shell.toast('日记已保存');
    }

    function previewImg(src) {
      $('previewImg').src = src;
      $('previewOverlay').classList.add('show');
      $('previewOverlay').focus();
    }
    $('previewOverlay').onclick = () => {
      $('previewOverlay').classList.remove('show');
      shell.dialog.restoreFocus();
    };

    $('editorOverlay').addEventListener('click', e => {
      if (e.target === $('editorOverlay')) closeEditor();
    });
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if ($('previewOverlay').classList.contains('show')) {
        $('previewOverlay').classList.remove('show');
      } else if ($('editorOverlay').classList.contains('show')) {
        closeEditor();
      }
    });

    ['diaryTitle', 'diaryDate', 'diaryStage', 'diaryContent'].forEach(id => {
      $(id).addEventListener('input', scheduleDraft);
    });

    window.openEditor = openEditor;
    window.closeEditor = closeEditor;
    window.saveDiary = saveDiary;

    renderDiaries();
  </script>
</body>
</html>
