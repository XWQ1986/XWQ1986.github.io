<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>装修小账本 - 实用工具</title>
  <link rel="icon" type="image/svg+xml" href="assets/yellow/logo.svg">
  <link rel="stylesheet" href="css/fresh.css">
  <style>
    /* 实用工具（对齐原版 实用工具.html） */
    .tool-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin: 0 0 26px; }
    .tool-heading h1 { margin: 0 0 8px; font-size: 28px; font-weight: 600; line-height: 1.35; }
    .tool-heading p { margin: 0; color: #70767B; font-size: 14px; }

    .tool-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; }

    .tool-group-title {
      padding: 0 0 13px;
      margin: 0;
      border-bottom: 1px solid #E9ECEC;
      font-size: 19px;
      font-weight: 600;
      line-height: 1.4;
    }
    .tools-grid { display: grid; gap: 0; }

    .tool-card {
      position: relative;
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      grid-template-rows: auto 1fr;
      align-items: start;
      gap: 6px 13px;
      min-height: 100px;
      padding: 24px 34px 24px 6px;
      border-bottom: 1px solid #E9ECEC;
      color: inherit;
      text-decoration: none;
      transition: background .2s;
    }
    .tool-card:last-child { border-bottom: 0; }
    .tool-card::after {
      content: '›';
      position: absolute;
      right: 4px;
      top: 40px;
      color: #70767B;
      font-size: 15px;
    }
    .tool-card:hover { background: #FFFDF0; }
    .tool-icon {
      grid-row: 1 / span 2;
      width: 40px;
      height: 44px;
      margin: 0;
    }
    .tool-icon img { width: 44px; height: 44px; object-fit: contain; }
    .tool-name { margin: 2px 0 0; font-size: 15px; font-weight: 600; line-height: 24px; }
    .tool-desc { color: #70767B; font-size: 13px; line-height: 1.65; }

    @media (max-width: 820px) {
      .tool-groups { grid-template-columns: 1fr; gap: 24px; }
      .tool-heading { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="tool-heading">
      <div>
        <h1>实用工具</h1>
        <p>装修过程中常用的计算工具，帮你快速搞定各种尺寸和用量</p>
      </div>
    </header>

    <div class="tool-groups">
      <section class="tool-group">
        <div class="tool-group-title">电路工具</div>
        <div class="tools-grid">
          <a class="tool-card" href="电路模拟器.html">
            <div class="tool-icon"><img src="assets/icons/plug.svg" alt=""></div>
            <div class="tool-name">电路回路模拟器</div>
            <div class="tool-desc">模拟家庭电路回路配置，快速检查负载和分路。</div>
          </a>
          <a class="tool-card" href="线径计算.html">
            <div class="tool-icon"><img src="assets/yellow/stats.svg" alt=""></div>
            <div class="tool-name">线径计算器</div>
            <div class="tool-desc">输入功率计算电流，并给出需由电工复核的线径参考。</div>
          </a>
        </div>
      </section>

      <section class="tool-group">
        <div class="tool-group-title">面积与用量</div>
        <div class="tools-grid">
          <a class="tool-card" href="面积计算.html">
            <div class="tool-icon"><img src="assets/yellow/flow.svg" alt=""></div>
            <div class="tool-name">面积计算器</div>
            <div class="tool-desc">支持矩形和 L 型房间面积汇总。</div>
          </a>
          <a class="tool-card" href="瓷砖用量.html">
            <div class="tool-icon"><img src="assets/yellow/stats.svg" alt=""></div>
            <div class="tool-name">瓷砖用量计算器</div>
            <div class="tool-desc">按砖规格和损耗率估算数量与箱数。</div>
          </a>
          <a class="tool-card" href="瓷砖排版模拟器-本地测试.html">
            <div class="tool-icon"><img src="assets/yellow/health.svg" alt=""></div>
            <div class="tool-name">瓷砖排版（申请开通）</div>
            <div class="tool-desc">原为进群申请制工具，需服务端支持；静态演示版仅保留申请入口。</div>
          </a>
        </div>
      </section>

      <section class="tool-group">
        <div class="tool-group-title">装修管理</div>
        <div class="tools-grid">
          <a class="tool-card" href="价格估算.html">
            <div class="tool-icon"><img src="assets/yellow/stats.svg" alt=""></div>
            <div class="tool-name">价格估算</div>
            <div class="tool-desc">按城市、面积和方式快速估算费用。</div>
          </a>
          <a class="tool-card" href="diary.html">
            <div class="tool-icon"><img src="assets/yellow/flow.svg" alt=""></div>
            <div class="tool-name">装修日记</div>
            <div class="tool-desc">记录施工过程、图片和关键节点。</div>
          </a>
        </div>
      </section>
    </div>
  </main>

  <script src="js/shell.js?v=20261109-snap"></script>
  <script>
    shell.renderNav('tools');
  </script>
</body>
</html>
